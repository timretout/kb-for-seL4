# GitHub Pages builds this repository with Jekyll, straight from main.
# Pages have no front matter: the plugins below (all on by default on
# GitHub Pages) give each one a title from its first heading, the default
# layout, and rewrite relative .md links to the built pages.
title: seL4 Knowledge Base
tagline: seL4 and the hardware under it, one concept per page
description: >-
  An unofficial reference to the seL4 microkernel and the hardware it runs
  on: one page per concept, in reading order, with primary sources.
url: https://timretout.github.io
baseurl: /sel4-kb
repository: timretout/sel4-kb
branch: main
lang: en-GB

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: none
  # Keep the text literal: no curly quotes, and "--flag" stays "--flag".
  smart_quotes: apos,apos,quot,quot
  typographic_symbols:
    hellip: "..."
    mdash: "---"
    ndash: "--"
    laquo: "<<"
    raquo: ">>"
    laquo_space: "<< "
    raquo_space: " >>"

plugins:
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-titles-from-headings
  - jekyll-default-layout
  - jekyll-sitemap

titles_from_headings:
  strip_title: false
  collapse_markup: true

optional_front_matter:
  remove_originals: true

defaults:
  - scope: { path: "INDEX.md" }
    values: { permalink: "/", home: true, filter: "Search all pages" }
  - scope: { path: "GLOSSARY.md" }
    values: { permalink: "/glossary/", filter: "Search the glossary" }

exclude:
  - README.md
  - LICENSE
  - CLAUDE.md
  - TEMPLATE.md
  - images/README.md
  - claude
  - ci
  - Gemfile
  - Gemfile.lock
  - vendor
