<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350" role="img">
  <title>Port-mapped I/O and MMIO from user level in seL4</title>
  <desc>A user thread reaches an I/O port by a system call on an IOPort capability: the kernel checks the range and executes in or out itself. A memory-mapped device is reached by ordinary loads and stores to a device frame mapped into the driver's VSpace.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: #1f2328; }
    .small { font-size: 12px; }
    .head { font-weight: 600; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; }
    .dim { fill: #57606a; }
    .hw { fill: #ddebff; stroke: #3b6bb5; }
    .fw { fill: #eee3fb; stroke: #7a52b3; }
    .kernel { fill: #ffe8cc; stroke: #b86e14; }
    .user { fill: #dcf3e1; stroke: #3d8a50; }
    .data { fill: #f3f4f6; stroke: #6e7781; }
    .hw, .fw, .kernel, .user, .data { stroke-width: 1.5; }
    .line { stroke: #1f2328; stroke-width: 1.5; fill: none; }
    .dash { stroke-dasharray: 5 4; }
    .accent { stroke: #cf222e; }
    .accent-fill { fill: #cf222e; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/>
    </marker>
  </defs>
  <rect width="760" height="350" fill="#ffffff"/>
  <text x="24" y="30" class="head">Port-mapped I/O: each access is a system call</text>
  <rect x="24" y="44" width="200" height="88" rx="6" class="user"/>
  <text x="36" y="66" class="head">user thread</text>
  <text x="36" y="86" class="small">calls <tspan class="mono">seL4_X86_IOPort_In8</tspan></text>
  <text x="36" y="102" class="small">and its siblings on an</text>
  <text x="36" y="118" class="small">IOPort capability</text>
  <path class="line" d="M224,88 H300" marker-end="url(#arrow)"/>
  <text x="262" y="66" text-anchor="middle" class="small">system</text>
  <text x="262" y="80" text-anchor="middle" class="small">call</text>
  <rect x="300" y="44" width="200" height="88" rx="6" class="kernel"/>
  <text x="312" y="66" class="head">seL4 kernel</text>
  <text x="312" y="86" class="small">checks every byte is within</text>
  <text x="312" y="102" class="small">the capability's range, then</text>
  <text x="312" y="118" class="small">executes the instruction</text>
  <path class="line" d="M500,88 H576" marker-end="url(#arrow)"/>
  <text x="538" y="80" text-anchor="middle" class="mono">in, out</text>
  <rect x="576" y="44" width="160" height="88" rx="6" class="hw"/>
  <text x="588" y="66" class="head">device registers</text>
  <text x="588" y="86" class="small">at I/O ports</text>
  <text x="24" y="156" class="small dim">The root task issues IOPort capabilities for port ranges with <tspan class="mono">seL4_X86_IOPortControl_Issue</tspan>.</text>
  <text x="24" y="172" class="small dim">A port belongs to at most one issued range.</text>
  <text x="24" y="214" class="head">Memory-mapped I/O: ordinary loads and stores</text>
  <rect x="24" y="228" width="200" height="72" rx="6" class="user"/>
  <text x="36" y="250" class="head">driver at user level</text>
  <text x="36" y="270" class="small">device frame mapped</text>
  <text x="36" y="286" class="small">into its VSpace</text>
  <path class="line" d="M224,264 H576" marker-end="url(#arrow)"/>
  <text x="400" y="256" text-anchor="middle">loads and stores</text>
  <rect x="576" y="228" width="160" height="72" rx="6" class="hw"/>
  <text x="588" y="250" class="head">device registers</text>
  <text x="588" y="270" class="small">at physical addresses</text>
  <text x="24" y="324" class="small dim">The frame is retyped from a device untyped handed to the root task. Arm and RISC-V have only this way.</text>
</svg>
