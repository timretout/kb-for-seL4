<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" width="760" height="370" role="img">
  <title>How the three supervisor interrupts are raised</title>
  <desc>Devices go through the PLIC, which drives SEIP directly. The CLINT machine timer and another hart&#x27;s IPI request go to M-mode firmware, which sets STIP and SSIP. The three bits are in the hart&#x27;s sip register.</desc>
  <style>
    svg { --bg: #ffffff; --fg: #1f2328; --dim: #57606a; --accent: #cf222e; --hw-fill: #ddebff; --hw-stroke: #3b6bb5; --fw-fill: #eee3fb; --fw-stroke: #7a52b3; --kernel-fill: #ffe8cc; --kernel-stroke: #b86e14; --user-fill: #dcf3e1; --user-stroke: #3d8a50; --data-fill: #f3f4f6; --data-stroke: #6e7781; --data-filled: #c8d1da; }
    @media (prefers-color-scheme: dark) { svg { --bg: #0d1117; --fg: #e6edf3; --dim: #9198a1; --accent: #ff7b72; --hw-fill: #112d52; --hw-stroke: #58a6ff; --fw-fill: #2c1f4a; --fw-stroke: #b48aff; --kernel-fill: #3d2812; --kernel-stroke: #e3a250; --user-fill: #13301c; --user-stroke: #56c26e; --data-fill: #21262d; --data-stroke: #8b949e; --data-filled: #484f58; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: var(--fg); }
    .small { font-size: 12px; }
    .head { font-weight: 600; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; }
    .dim { fill: var(--dim); }
    .hw { fill: var(--hw-fill); stroke: var(--hw-stroke); }
    .fw { fill: var(--fw-fill); stroke: var(--fw-stroke); }
    .kernel { fill: var(--kernel-fill); stroke: var(--kernel-stroke); }
    .user { fill: var(--user-fill); stroke: var(--user-stroke); }
    .data { fill: var(--data-fill); stroke: var(--data-stroke); }
    .hw, .fw, .kernel, .user, .data { stroke-width: 1.5; }
    .line { stroke: var(--fg); stroke-width: 1.5; fill: none; }
    .dash { stroke-dasharray: 5 4; }
    .accent { stroke: var(--accent); }
    .accent-fill { fill: var(--accent); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--fg)"/>
    </marker>
  </defs>
  <rect width="760" height="370" style="fill: var(--bg)"/>
  <rect x="520" y="20" width="224" height="290" rx="6" class="data"/>
  <text x="632" y="44" text-anchor="middle" class="head">sip, per hart</text>
  <rect x="536" y="62" width="192" height="56" rx="6" class="hw"/>
  <text x="632.0" y="86.5" text-anchor="middle" class="mono">SEIP, bit 9</text>
  <text x="632.0" y="103.5" text-anchor="middle" class="small">external</text>
  <rect x="536" y="152" width="192" height="56" rx="6" class="hw"/>
  <text x="632.0" y="176.5" text-anchor="middle" class="mono">STIP, bit 5</text>
  <text x="632.0" y="193.5" text-anchor="middle" class="small">timer</text>
  <rect x="536" y="242" width="192" height="56" rx="6" class="hw"/>
  <text x="632.0" y="266.5" text-anchor="middle" class="mono">SSIP, bit 1</text>
  <text x="632.0" y="283.5" text-anchor="middle" class="small">software</text>
  <rect x="16" y="62" width="190" height="56" rx="6" class="hw"/>
  <text x="111.0" y="95.0" text-anchor="middle" class="head">Devices</text>
  <rect x="270" y="62" width="180" height="56" rx="6" class="hw"/>
  <text x="360.0" y="86.5" text-anchor="middle" class="head">PLIC</text>
  <text x="360.0" y="103.5" text-anchor="middle" class="small">claim, then complete</text>
  <rect x="16" y="152" width="190" height="56" rx="6" class="hw"/>
  <text x="111.0" y="176.5" text-anchor="middle" class="head">CLINT</text>
  <text x="111.0" y="193.5" text-anchor="middle" class="mono">mtime &gt;= mtimecmp</text>
  <rect x="16" y="242" width="190" height="56" rx="6" class="kernel"/>
  <text x="111.0" y="266.5" text-anchor="middle" class="head">Another hart</text>
  <text x="111.0" y="283.5" text-anchor="middle" class="mono">sbi_send_ipi</text>
  <rect x="270" y="152" width="180" height="146" rx="6" class="fw"/>
  <text x="360.0" y="221.5" text-anchor="middle" class="head">M-mode firmware</text>
  <text x="360.0" y="238.5" text-anchor="middle" class="small">(SBI)</text>
  <path class="line" d="M206,90 H270" marker-end="url(#arrow)"/>
  <path class="line" d="M450,90 H536" marker-end="url(#arrow)"/>
  <path class="line" d="M206,180 H270" marker-end="url(#arrow)"/>
  <path class="line" d="M450,180 H536" marker-end="url(#arrow)"/>
  <path class="line" d="M206,270 H270" marker-end="url(#arrow)"/>
  <path class="line" d="M450,270 H536" marker-end="url(#arrow)"/>
  <text x="16" y="338" class="small">A source interrupts S-mode when its sip and sie bits are both set</text>
  <text x="16" y="354" class="small">and either sstatus.SIE is 1 or the hart is running in U-mode.</text>
</svg>
