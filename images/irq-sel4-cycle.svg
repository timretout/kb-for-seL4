<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img">
  <title>One interrupt through seL4</title>
  <desc>A sequence between device, interrupt controller, seL4 kernel and driver thread: the kernel signals the driver's notification, masks the IRQ and acknowledges the controller; the driver services the device and calls seL4_IRQHandler_Ack, which unmasks the IRQ.</desc>
  <style>
    svg { --bg: #ffffff; --fg: #1f2328; --dim: #57606a; --accent: #cf222e; --hw-fill: #ddebff; --hw-stroke: #3b6bb5; --fw-fill: #eee3fb; --fw-stroke: #7a52b3; --kernel-fill: #ffe8cc; --kernel-stroke: #b86e14; --user-fill: #dcf3e1; --user-stroke: #3d8a50; --data-fill: #f3f4f6; --data-stroke: #6e7781; --data-filled: #c8d1da; }
    @media (prefers-color-scheme: dark) { svg { --bg: #0d1117; --fg: #e6edf3; --dim: #9198a1; --accent: #ff7b72; --hw-fill: #112d52; --hw-stroke: #58a6ff; --fw-fill: #2c1f4a; --fw-stroke: #b48aff; --kernel-fill: #3d2812; --kernel-stroke: #e3a250; --user-fill: #13301c; --user-stroke: #56c26e; --data-fill: #21262d; --data-stroke: #8b949e; --data-filled: #484f58; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: var(--fg); }
    .small { font-size: 12px; }
    .head { font-weight: 600; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; }
    .dim { fill: var(--dim); }
    .hw { fill: var(--hw-fill); stroke: var(--hw-stroke); }
    .fw { fill: var(--fw-fill); stroke: var(--fw-stroke); }
    .kernel { fill: var(--kernel-fill); stroke: var(--kernel-stroke); }
    .user { fill: var(--user-fill); stroke: var(--user-stroke); }
    .data { fill: var(--data-fill); stroke: var(--data-stroke); }
    .hw, .fw, .kernel, .user, .data { stroke-width: 1.5; }
    .line { stroke: var(--fg); stroke-width: 1.5; fill: none; }
    .dash { stroke-dasharray: 5 4; }
    .accent { stroke: var(--accent); }
    .accent-fill { fill: var(--accent); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--fg)"/>
    </marker>
  </defs>
  <rect width="760" height="420" style="fill: var(--bg)"/>
  <rect x="25" y="20" width="140" height="36" rx="6" class="hw"/>
  <text x="95" y="43" text-anchor="middle">Device</text>
  <path class="line dash" d="M95,56 V400"/>
  <rect x="215" y="20" width="140" height="36" rx="6" class="hw"/>
  <text x="285" y="43" text-anchor="middle">Controller</text>
  <path class="line dash" d="M285,56 V400"/>
  <rect x="405" y="20" width="140" height="36" rx="6" class="kernel"/>
  <text x="475" y="43" text-anchor="middle">seL4 kernel</text>
  <path class="line dash" d="M475,56 V400"/>
  <rect x="595" y="20" width="140" height="36" rx="6" class="user"/>
  <text x="665" y="43" text-anchor="middle">Driver thread</text>
  <path class="line dash" d="M665,56 V400"/>
  <path class="line" d="M95,95 H285" marker-end="url(#arrow)"/>
  <rect x="126" y="75" width="128" height="16" style="fill: var(--bg)"/>
  <text x="190" y="88" text-anchor="middle">asserts its line</text>
  <path class="line" d="M285,130 H475" marker-end="url(#arrow)"/>
  <rect x="308.5" y="110" width="143" height="16" style="fill: var(--bg)"/>
  <text x="380" y="123" text-anchor="middle">delivers interrupt</text>
  <text x="483" y="152" class="mono">handleInterrupt()</text>
  <path class="line" d="M475,180 H665" marker-end="url(#arrow)"/>
  <rect x="491" y="160" width="158" height="16" style="fill: var(--bg)"/>
  <text x="570" y="173" text-anchor="middle">signals notification</text>
  <path class="line" d="M475,215 H285" marker-end="url(#arrow)"/>
  <rect x="304.75" y="195" width="150.5" height="16" style="fill: var(--bg)"/>
  <text x="380" y="208" text-anchor="middle">masks, acknowledges</text>
  <rect x="323.2" y="220" width="113.6" height="15" style="fill: var(--bg)"/>
  <text x="380" y="232" text-anchor="middle" class="small dim">no mask on GICv3</text>
  <path class="line" d="M665,270 H95" marker-end="url(#arrow)"/>
  <rect x="296" y="250" width="260" height="16" style="fill: var(--bg)"/>
  <text x="300" y="263">services the device, clearing the cause</text>
  <path class="line" d="M665,320 H475" marker-end="url(#arrow)"/>
  <rect x="490" y="300" width="160" height="16" style="fill: var(--bg)"/>
  <text x="570" y="313" text-anchor="middle" class="mono">seL4_IRQHandler_Ack</text>
  <path class="line" d="M475,360 H285" marker-end="url(#arrow)"/>
  <rect x="349.75" y="340" width="60.5" height="16" style="fill: var(--bg)"/>
  <text x="380" y="353" text-anchor="middle">unmasks</text>
  <rect x="316.6" y="365" width="126.8" height="15" style="fill: var(--bg)"/>
  <text x="380" y="377" text-anchor="middle" class="small dim">GICv3: deactivates</text>
  <rect x="281" y="215" width="8" height="145" class="accent-fill"/>
  <text x="273" y="300" text-anchor="end" class="small">IRQ</text>
  <text x="273" y="315" text-anchor="end" class="small">masked</text>
</svg>
