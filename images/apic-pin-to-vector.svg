<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img">
  <title>From ISA IRQ to seL4 IRQ number on x86</title>
  <desc>The chain of numbers for an I/O APIC interrupt: ISA IRQ, global system interrupt, I/O APIC index and pin, CPU vector, seL4 IRQ number. seL4_IRQControl_GetIOAPIC names the I/O APIC and pin and gives a vector argument; the CPU vector is 0x30 plus that argument.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: #1f2328; }
    .small { font-size: 12px; }
    .head { font-weight: 600; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; }
    .dim { fill: #57606a; }
    .hw { fill: #ddebff; stroke: #3b6bb5; }
    .fw { fill: #eee3fb; stroke: #7a52b3; }
    .kernel { fill: #ffe8cc; stroke: #b86e14; }
    .user { fill: #dcf3e1; stroke: #3d8a50; }
    .data { fill: #f3f4f6; stroke: #6e7781; }
    .hw, .fw, .kernel, .user, .data { stroke-width: 1.5; }
    .line { stroke: #1f2328; stroke-width: 1.5; fill: none; }
    .dash { stroke-dasharray: 5 4; }
    .accent { stroke: #cf222e; }
    .accent-fill { fill: #cf222e; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/>
    </marker>
  </defs>
  <rect width="760" height="500" fill="#ffffff"/>
  <rect x="20" y="30" width="230" height="44" rx="6" class="data"/>
  <text x="135" y="57" text-anchor="middle">ISA IRQ n</text>
  <rect x="20" y="130" width="230" height="44" rx="6" class="data"/>
  <text x="135" y="148" text-anchor="middle">GSI</text>
  <text x="135" y="166" text-anchor="middle" class="small dim">machine-wide number</text>
  <rect x="20" y="230" width="230" height="44" rx="6" class="hw"/>
  <text x="135" y="257" text-anchor="middle">I/O APIC index and pin</text>
  <rect x="20" y="330" width="230" height="44" rx="6" class="hw"/>
  <text x="135" y="357" text-anchor="middle">CPU vector</text>
  <rect x="20" y="430" width="230" height="44" rx="6" class="kernel"/>
  <text x="135" y="457" text-anchor="middle">seL4 IRQ number</text>
  <path class="line" d="M135,74 V130" marker-end="url(#arrow)"/>
  <path class="line" d="M135,174 V230" marker-end="url(#arrow)"/>
  <path class="line" d="M135,274 V330" marker-end="url(#arrow)"/>
  <path class="line" d="M135,374 V430" marker-end="url(#arrow)"/>
  <text x="150" y="98">GSI n, unless a MADT interrupt source</text>
  <text x="150" y="116">override says otherwise</text>
  <text x="150" y="198">found using each I/O APIC's GSI base,</text>
  <text x="150" y="216">the GSI of its pin 0</text>
  <text x="150" y="298">the pin's redirection table entry,</text>
  <text x="150" y="316">at register 0x10 + 2 × pin</text>
  <text x="150" y="407">IRQ number = vector − 0x20</text>
  <rect x="520" y="230" width="224" height="144" rx="6" class="user"/>
  <text x="632" y="280" text-anchor="middle" class="mono">seL4_IRQControl_GetIOAPIC</text>
  <text x="632" y="298" text-anchor="middle" class="mono">(ioapic, pin, level,</text>
  <text x="632" y="316" text-anchor="middle" class="mono">polarity, vector)</text>
  <text x="632" y="334" text-anchor="middle" class="small dim">vector is 0 to 107</text>
  <path class="line" d="M520,252 H250" marker-end="url(#arrow)"/>
  <text x="385" y="244" text-anchor="middle" class="mono">ioapic, pin</text>
  <path class="line accent" d="M520,352 H250" marker-end="url(#arrow)"/>
  <text x="385" y="344" text-anchor="middle" class="mono">0x30 + vector</text>
</svg>
