<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img">
  <title>The shape of every seL4 kernel entry</title>
  <desc>Assembly saves the user registers into the old thread's TCB, C code handles the event and may change ksCurThread, and restore_user_context loads the registers of the current thread from its TCB and returns to user level.</desc>
  <style>
    svg { --bg: #ffffff; --fg: #1f2328; --dim: #57606a; --accent: #cf222e; --hw-fill: #ddebff; --hw-stroke: #3b6bb5; --fw-fill: #eee3fb; --fw-stroke: #7a52b3; --kernel-fill: #ffe8cc; --kernel-stroke: #b86e14; --user-fill: #dcf3e1; --user-stroke: #3d8a50; --data-fill: #f3f4f6; --data-stroke: #6e7781; --data-filled: #c8d1da; }
    @media (prefers-color-scheme: dark) { svg { --bg: #0d1117; --fg: #e6edf3; --dim: #9198a1; --accent: #ff7b72; --hw-fill: #112d52; --hw-stroke: #58a6ff; --fw-fill: #2c1f4a; --fw-stroke: #b48aff; --kernel-fill: #3d2812; --kernel-stroke: #e3a250; --user-fill: #13301c; --user-stroke: #56c26e; --data-fill: #21262d; --data-stroke: #8b949e; --data-filled: #484f58; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: var(--fg); }
    .small { font-size: 12px; }
    .head { font-weight: 600; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; }
    .dim { fill: var(--dim); }
    .hw { fill: var(--hw-fill); stroke: var(--hw-stroke); }
    .fw { fill: var(--fw-fill); stroke: var(--fw-stroke); }
    .kernel { fill: var(--kernel-fill); stroke: var(--kernel-stroke); }
    .user { fill: var(--user-fill); stroke: var(--user-stroke); }
    .data { fill: var(--data-fill); stroke: var(--data-stroke); }
    .hw, .fw, .kernel, .user, .data { stroke-width: 1.5; }
    .line { stroke: var(--fg); stroke-width: 1.5; fill: none; }
    .dash { stroke-dasharray: 5 4; }
    .accent { stroke: var(--accent); }
    .accent-fill { fill: var(--accent); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--fg)"/>
    </marker>
  </defs>
  <rect width="760" height="470" style="fill: var(--bg)"/>
  <rect x="176" y="20" width="244" height="40" rx="6" class="user"/>
  <text x="298.0" y="45" text-anchor="middle">user thread running</text>
  <path class="line" d="M298.0,60 V90" marker-end="url(#arrow)"/>
  <text x="436" y="80" class="small">kernel entry: exception, system call or interrupt</text>
  <rect x="176" y="90" width="244" height="50" rx="6" class="kernel"/>
  <text x="298.0" y="112" text-anchor="middle">assembly entry code</text>
  <text x="298.0" y="130" class="mono" text-anchor="middle">traps.S</text>
  <text x="436" y="111" class="small">saves the user registers straight into</text>
  <text x="436" y="127" class="small">the current thread's TCB, not onto a stack</text>
  <path class="line" d="M298.0,140 V170" marker-end="url(#arrow)"/>
  <rect x="176" y="170" width="244" height="50" rx="6" class="kernel"/>
  <text x="298.0" y="192" class="mono" text-anchor="middle">c_handle_*</text>
  <text x="298.0" y="210" class="small" text-anchor="middle">in <tspan class="mono">c_traps.c</tspan></text>
  <text x="436" y="191" class="small">takes the big kernel lock on SMP,</text>
  <text x="436" y="207" class="small">decodes the cause</text>
  <path class="line" d="M298.0,220 V250" marker-end="url(#arrow)"/>
  <rect x="176" y="250" width="244" height="50" rx="6" class="kernel"/>
  <text x="298.0" y="272" text-anchor="middle">one of five functions in</text>
  <text x="298.0" y="290" class="mono" text-anchor="middle">src/api/syscall.c</text>
  <text x="436" y="263" class="small">does the work, perhaps changing</text>
  <text x="436" y="279" class="small"><tspan class="mono">ksCurThread</tspan>; ends with <tspan class="mono">schedule()</tspan></text>
  <text x="436" y="295" class="small">and <tspan class="mono">activateThread()</tspan></text>
  <path class="line" d="M298.0,300 V330" marker-end="url(#arrow)"/>
  <rect x="176" y="330" width="244" height="50" rx="6" class="kernel"/>
  <text x="298.0" y="360" class="mono" text-anchor="middle">restore_user_context()</text>
  <text x="436" y="351" class="small">reloads the registers of <tspan class="mono">ksCurThread</tspan></text>
  <text x="436" y="367" class="small">and executes the return instruction</text>
  <path class="line" d="M298.0,380 V410" marker-end="url(#arrow)"/>
  <rect x="176" y="410" width="244" height="40" rx="6" class="user"/>
  <text x="298.0" y="435" text-anchor="middle">current thread, possibly another</text>
  <rect x="24" y="90" width="116" height="50" rx="6" class="kernel"/>
  <text x="82" y="112" text-anchor="middle">old thread's</text>
  <text x="82" y="130" text-anchor="middle">TCB</text>
  <path class="line" d="M176,115 H140" marker-end="url(#arrow)"/>
  <rect x="24" y="330" width="116" height="50" rx="6" class="kernel"/>
  <text x="82" y="352" class="small" text-anchor="middle">current thread's</text>
  <text x="82" y="370" text-anchor="middle">TCB</text>
  <path class="line" d="M140,355 H176" marker-end="url(#arrow)"/>
  <text x="24" y="160" class="small dim">save</text>
  <text x="24" y="322" class="small dim">load</text>
</svg>
