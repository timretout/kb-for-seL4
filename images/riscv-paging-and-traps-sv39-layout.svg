<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 385" width="760" height="385" role="img">
  <title>seL4 virtual address layout under Sv39</title>
  <desc>The high half holds the kernel window from PPTR_BASE to PPTR_TOP (254 GiB), then 1 GiB for the kernel image and the top 1 GiB for kernel devices; these root entries are copied into every new root table. User addresses end at seL4_UserTop in the low half.</desc>
  <style>
    svg { --bg: #ffffff; --fg: #1f2328; --dim: #57606a; --accent: #cf222e; --hw-fill: #ddebff; --hw-stroke: #3b6bb5; --fw-fill: #eee3fb; --fw-stroke: #7a52b3; --kernel-fill: #ffe8cc; --kernel-stroke: #b86e14; --user-fill: #dcf3e1; --user-stroke: #3d8a50; --data-fill: #f3f4f6; --data-stroke: #6e7781; --data-filled: #c8d1da; }
    @media (prefers-color-scheme: dark) { svg { --bg: #0d1117; --fg: #e6edf3; --dim: #9198a1; --accent: #ff7b72; --hw-fill: #112d52; --hw-stroke: #58a6ff; --fw-fill: #2c1f4a; --fw-stroke: #b48aff; --kernel-fill: #3d2812; --kernel-stroke: #e3a250; --user-fill: #13301c; --user-stroke: #56c26e; --data-fill: #21262d; --data-stroke: #8b949e; --data-filled: #484f58; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: var(--fg); }
    .small { font-size: 12px; }
    .head { font-weight: 600; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; }
    .dim { fill: var(--dim); }
    .hw { fill: var(--hw-fill); stroke: var(--hw-stroke); }
    .fw { fill: var(--fw-fill); stroke: var(--fw-stroke); }
    .kernel { fill: var(--kernel-fill); stroke: var(--kernel-stroke); }
    .user { fill: var(--user-fill); stroke: var(--user-stroke); }
    .data { fill: var(--data-fill); stroke: var(--data-stroke); }
    .hw, .fw, .kernel, .user, .data { stroke-width: 1.5; }
    .line { stroke: var(--fg); stroke-width: 1.5; fill: none; }
    .dash { stroke-dasharray: 5 4; }
    .accent { stroke: var(--accent); }
    .accent-fill { fill: var(--accent); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--fg)"/>
    </marker>
  </defs>
  <rect width="760" height="385" style="fill: var(--bg)"/>
  <rect x="300" y="30" width="250" height="40" rx="0" class="kernel"/>
  <text x="425.0" y="55.0" text-anchor="middle">Kernel devices, 1 GiB</text>
  <rect x="300" y="70" width="250" height="40" rx="0" class="kernel"/>
  <text x="425.0" y="95.0" text-anchor="middle">Kernel image, 1 GiB</text>
  <rect x="300" y="110" width="250" height="100" rx="0" class="kernel"/>
  <text x="425.0" y="156.5" text-anchor="middle">Kernel window, 254 GiB</text>
  <text x="425.0" y="173.5" text-anchor="middle" class="small">global RWX gigapages</text>
  <rect x="300" y="210" width="250" height="50" rx="0" class="data" stroke-dasharray="5 4"/>
  <text x="425.0" y="231.5" text-anchor="middle" class="small">unused upper bits must</text>
  <text x="425.0" y="248.5" text-anchor="middle" class="small">equal bit 38</text>
  <rect x="300" y="260" width="250" height="100" rx="0" class="user"/>
  <text x="425.0" y="306.5" text-anchor="middle">User addresses</text>
  <text x="425.0" y="323.5" text-anchor="middle" class="small">low half, 256 GiB</text>
  <text x="288" y="75" text-anchor="end" class="mono">KDEV_BASE</text>
  <text x="288" y="106" text-anchor="end" class="mono">KERNEL_ELF_BASE</text>
  <text x="288" y="123" text-anchor="end" class="mono">PPTR_TOP 0xFFFFFFFF80000000</text>
  <text x="288" y="206" text-anchor="end" class="mono">PPTR_BASE 0xFFFFFFC000000000</text>
  <text x="288" y="274" text-anchor="end" class="mono">seL4_UserTop 0x0000003ffffff000</text>
  <text x="288" y="364" text-anchor="end" class="mono">0</text>
  <path class="line" d="M560,32 H568 V208 H560"/>
  <text x="578" y="100" class="small">high half, 256 GiB</text>
  <text x="578" y="122" class="small">copied into every</text>
  <text x="578" y="138" class="small">new root table by</text>
  <text x="578" y="155" class="mono">copyGlobalMappings</text>
</svg>
