<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 308" width="760" height="308" role="img">
  <title>Who prints during an Arm boot</title>
  <desc>On Arm the elfloader prints first, then a printing-build kernel prints boot messages ending with "Booting all finished, dropped to user space", and everything after that comes from user level or a fault dump. Where the output stops points at the usual cause.</desc>
  <style>
    svg { --bg: #ffffff; --fg: #1f2328; --dim: #57606a; --accent: #cf222e; --hw-fill: #ddebff; --hw-stroke: #3b6bb5; --fw-fill: #eee3fb; --fw-stroke: #7a52b3; --kernel-fill: #ffe8cc; --kernel-stroke: #b86e14; --user-fill: #dcf3e1; --user-stroke: #3d8a50; --data-fill: #f3f4f6; --data-stroke: #6e7781; --data-filled: #c8d1da; }
    @media (prefers-color-scheme: dark) { svg { --bg: #0d1117; --fg: #e6edf3; --dim: #9198a1; --accent: #ff7b72; --hw-fill: #112d52; --hw-stroke: #58a6ff; --fw-fill: #2c1f4a; --fw-stroke: #b48aff; --kernel-fill: #3d2812; --kernel-stroke: #e3a250; --user-fill: #13301c; --user-stroke: #56c26e; --data-fill: #21262d; --data-stroke: #8b949e; --data-filled: #484f58; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: var(--fg); }
    .small { font-size: 12px; }
    .head { font-weight: 600; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; }
    .dim { fill: var(--dim); }
    .hw { fill: var(--hw-fill); stroke: var(--hw-stroke); }
    .fw { fill: var(--fw-fill); stroke: var(--fw-stroke); }
    .kernel { fill: var(--kernel-fill); stroke: var(--kernel-stroke); }
    .user { fill: var(--user-fill); stroke: var(--user-stroke); }
    .data { fill: var(--data-fill); stroke: var(--data-stroke); }
    .hw, .fw, .kernel, .user, .data { stroke-width: 1.5; }
    .line { stroke: var(--fg); stroke-width: 1.5; fill: none; }
    .dash { stroke-dasharray: 5 4; }
    .accent { stroke: var(--accent); }
    .accent-fill { fill: var(--accent); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--fg)"/>
    </marker>
  </defs>
  <rect width="760" height="308" style="fill: var(--bg)"/>
  <rect class="fw" x="16" y="24" width="226" height="126" rx="6"/>
  <text x="30" y="48" class="head">Elfloader (Arm)</text>
  <text x="30" y="68" class="small dim">prints first:</text>
  <text x="30" y="92" class="mono">ELF-loader started on ...</text>
  <text x="30" y="111" class="mono">Enabling MMU and jumping</text>
  <text x="30" y="130" class="mono">to entry point...</text>
  <path class="line dash" d="M129,150 V196" marker-end="url(#arrow)"/>
  <rect class="data" x="16" y="196" width="226" height="96" rx="6"/>
  <text x="30" y="219" class="head">Output stops here</text>
  <text x="30" y="241" class="small">kernel console wrong, or a</text>
  <text x="30" y="258" class="small">crash before init_kernel</text>
  <text x="30" y="275" class="small">prints</text>
  <rect class="kernel" x="267" y="24" width="226" height="126" rx="6"/>
  <text x="281" y="48" class="head">Kernel, printing build</text>
  <text x="281" y="68" class="small dim">boot messages, ending with:</text>
  <text x="281" y="92" class="mono">Booting all finished,</text>
  <text x="281" y="111" class="mono">dropped to user space</text>
  <path class="line dash" d="M380,150 V196" marker-end="url(#arrow)"/>
  <rect class="data" x="267" y="196" width="226" height="96" rx="6"/>
  <text x="281" y="219" class="head">Output stops here</text>
  <text x="281" y="241" class="small">an ERROR: line says why; on</text>
  <text x="281" y="258" class="small">x86 a device the kernel waits</text>
  <text x="281" y="275" class="small">on is missing</text>
  <rect class="user" x="518" y="24" width="226" height="126" rx="6"/>
  <text x="532" y="48" class="head">User level</text>
  <text x="532" y="68" class="small dim">everything after that line:</text>
  <text x="532" y="92">root task output, or a</text>
  <text x="532" y="111">fault dump from the kernel</text>
  <path class="line dash" d="M631,150 V196" marker-end="url(#arrow)"/>
  <rect class="data" x="518" y="196" width="226" height="96" rx="6"/>
  <text x="532" y="219" class="head">Output stops here</text>
  <text x="532" y="241" class="small">root task faulted before it</text>
  <text x="532" y="258" class="small">could print, or prints through</text>
  <text x="532" y="275" class="small">a driver for a UART not there</text>
  <path class="line" d="M242,60 H267" marker-end="url(#arrow)"/>
  <path class="line" d="M493,60 H518" marker-end="url(#arrow)"/>
</svg>
