<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 276" width="760" height="276" role="img">
  <title>Two-stage address translation with EPT</title>
  <desc>The guest's own page tables translate a guest-virtual address to a guest-physical address, and the hypervisor's four-level EPT translates that to a host-physical address. A missing EPT translation causes an EPT violation exit.</desc>
  <style>
    svg { --bg: #ffffff; --fg: #1f2328; --dim: #57606a; --accent: #cf222e; --hw-fill: #ddebff; --hw-stroke: #3b6bb5; --fw-fill: #eee3fb; --fw-stroke: #7a52b3; --kernel-fill: #ffe8cc; --kernel-stroke: #b86e14; --user-fill: #dcf3e1; --user-stroke: #3d8a50; --data-fill: #f3f4f6; --data-stroke: #6e7781; --data-filled: #c8d1da; }
    @media (prefers-color-scheme: dark) { svg { --bg: #0d1117; --fg: #e6edf3; --dim: #9198a1; --accent: #ff7b72; --hw-fill: #112d52; --hw-stroke: #58a6ff; --fw-fill: #2c1f4a; --fw-stroke: #b48aff; --kernel-fill: #3d2812; --kernel-stroke: #e3a250; --user-fill: #13301c; --user-stroke: #56c26e; --data-fill: #21262d; --data-stroke: #8b949e; --data-filled: #484f58; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: var(--fg); }
    .small { font-size: 12px; }
    .head { font-weight: 600; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; }
    .dim { fill: var(--dim); }
    .hw { fill: var(--hw-fill); stroke: var(--hw-stroke); }
    .fw { fill: var(--fw-fill); stroke: var(--fw-stroke); }
    .kernel { fill: var(--kernel-fill); stroke: var(--kernel-stroke); }
    .user { fill: var(--user-fill); stroke: var(--user-stroke); }
    .data { fill: var(--data-fill); stroke: var(--data-stroke); }
    .hw, .fw, .kernel, .user, .data { stroke-width: 1.5; }
    .line { stroke: var(--fg); stroke-width: 1.5; fill: none; }
    .dash { stroke-dasharray: 5 4; }
    .accent { stroke: var(--accent); }
    .accent-fill { fill: var(--accent); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--fg)"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--accent)"/>
    </marker>
  </defs>
  <rect width="760" height="276" style="fill: var(--bg)"/>
  <rect x="24" y="40" width="150" height="56" rx="6" class="data"/>
  <text x="99" y="64" text-anchor="middle" class="head">guest-virtual</text>
  <text x="99" y="82" text-anchor="middle" class="small">address</text>
  <rect x="305" y="40" width="150" height="56" rx="6" class="data"/>
  <text x="380" y="64" text-anchor="middle" class="head">guest-physical</text>
  <text x="380" y="82" text-anchor="middle" class="small">address</text>
  <rect x="586" y="40" width="150" height="56" rx="6" class="data"/>
  <text x="661" y="64" text-anchor="middle" class="head">host-physical</text>
  <text x="661" y="82" text-anchor="middle" class="small">address</text>
  <path class="line" d="M174,68 H305" marker-end="url(#arrow)"/>
  <path class="line" d="M455,68 H586" marker-end="url(#arrow)"/>
  <path class="line dash" d="M240,136 V72"/>
  <path class="line dash" d="M520,136 V72"/>
  <rect x="130" y="136" width="220" height="60" rx="6" class="data"/>
  <text x="240" y="160" text-anchor="middle">the guest's own page tables</text>
  <text x="240" y="180" text-anchor="middle" class="small">guest-virtual to guest-physical</text>
  <rect x="400" y="136" width="240" height="76" rx="6" class="fw"/>
  <text x="520" y="160" text-anchor="middle">EPT: PML4, PDPT, PD, PT</text>
  <text x="520" y="180" text-anchor="middle" class="small">owned by the hypervisor;</text>
  <text x="520" y="196" text-anchor="middle" class="small">read, write and execute bits</text>
  <path class="line accent" d="M520,212 V240" marker-end="url(#arrow-accent)"/>
  <text x="520" y="258" text-anchor="middle">no translation: EPT violation exit (reason 48)</text>
</svg>
