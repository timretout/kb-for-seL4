<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 395" width="760" height="395" role="img">
  <title>seL4 IOMMU capabilities on x86 and Arm</title>
  <desc>On x86 the master IOSpace cap is minted into a cap for one device, under which I/O page table objects and frames are mapped; on Arm a SID cap for one stream ID is bound to a CB cap for one context bank, which is assigned an ordinary VSpace.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: #1f2328; }
    .small { font-size: 12px; }
    .head { font-weight: 600; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; }
    .dim { fill: #57606a; }
    .hw { fill: #ddebff; stroke: #3b6bb5; }
    .fw { fill: #eee3fb; stroke: #7a52b3; }
    .kernel { fill: #ffe8cc; stroke: #b86e14; }
    .user { fill: #dcf3e1; stroke: #3d8a50; }
    .data { fill: #f3f4f6; stroke: #6e7781; }
    .hw, .fw, .kernel, .user, .data { stroke-width: 1.5; }
    .line { stroke: #1f2328; stroke-width: 1.5; fill: none; }
    .dash { stroke-dasharray: 5 4; }
    .accent { stroke: #cf222e; }
    .accent-fill { fill: #cf222e; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/>
    </marker>
  </defs>
  <rect width="760" height="395" fill="#ffffff"/>
  <text x="24" y="36" text-anchor="start" class="head">x86, VT-d: I/O page tables are objects of their own</text>
  <rect x="24" y="54" width="150" height="56" rx="6" class="kernel"/>
  <text x="99.0" y="78" text-anchor="middle">master IOSpace cap</text>
  <text x="99.0" y="96" text-anchor="middle" class="mono">seL4_CapIOSpace</text>
  <rect x="250" y="54" width="150" height="56" rx="6" class="kernel"/>
  <text x="325.0" y="78" text-anchor="middle">IOSpace cap for</text>
  <text x="325.0" y="96" text-anchor="middle">one device</text>
  <rect x="470" y="54" width="130" height="56" rx="6" class="kernel"/>
  <text x="535.0" y="87" text-anchor="middle">I/O page tables</text>
  <rect x="660" y="54" width="76" height="56" rx="6" class="kernel"/>
  <text x="698.0" y="87" text-anchor="middle">frame</text>
  <path class="line" d="M174,82 H250" marker-end="url(#arrow)"/>
  <text x="212" y="74" text-anchor="middle" class="small">mint</text>
  <path class="line" d="M470,82 H400" marker-end="url(#arrow)"/>
  <path class="line" d="M660,82 H600" marker-end="url(#arrow)"/>
  <text x="535" y="130" text-anchor="middle" class="mono">seL4_X86_IOPageTable_Map</text>
  <text x="736" y="150" text-anchor="end" class="mono">seL4_X86_Page_MapIO</text>
  <text x="325" y="130" text-anchor="middle" class="small">badge: domain ID and</text>
  <text x="325" y="146" text-anchor="middle" class="small">PCI bus, device, function</text>
  <text x="24" y="206" text-anchor="start" class="head">Arm, SMMUv2: the device shares a VSpace's page tables</text>
  <rect x="24" y="224" width="130" height="56" rx="6" class="kernel"/>
  <text x="89.0" y="257" text-anchor="middle">SID control cap</text>
  <rect x="240" y="224" width="90" height="56" rx="6" class="kernel"/>
  <text x="285.0" y="257" text-anchor="middle">SID cap</text>
  <rect x="430" y="224" width="90" height="56" rx="6" class="kernel"/>
  <text x="475.0" y="257" text-anchor="middle">CB cap</text>
  <rect x="640" y="224" width="96" height="56" rx="6" class="kernel"/>
  <text x="688.0" y="257" text-anchor="middle">VSpace</text>
  <rect x="410" y="330" width="130" height="44" rx="6" class="kernel"/>
  <text x="475.0" y="357" text-anchor="middle">CB control cap</text>
  <path class="line" d="M154,252 H240" marker-end="url(#arrow)"/>
  <text x="197" y="244" text-anchor="middle" class="mono">GetSID</text>
  <path class="line" d="M330,252 H430" marker-end="url(#arrow)"/>
  <text x="380" y="244" text-anchor="middle" class="mono">BindCB</text>
  <path class="line" d="M520,252 H640" marker-end="url(#arrow)"/>
  <text x="580" y="244" text-anchor="middle" class="mono">AssignVspace</text>
  <path class="line" d="M475,330 V280" marker-end="url(#arrow)"/>
  <text x="485" y="310" text-anchor="start" class="mono">GetCB</text>
</svg>
