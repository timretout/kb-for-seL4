<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 285" width="760" height="285" role="img">
  <title>A DMA access through an IOMMU</title>
  <desc>A device's DMA carries its ID and an I/O virtual address; the IOMMU looks the address up in the page tables assigned to that device, lets it reach only the buffers the OS mapped, and blocks and reports anything else.</desc>
  <style>
    svg { --bg: #ffffff; --fg: #1f2328; --dim: #57606a; --accent: #cf222e; --hw-fill: #ddebff; --hw-stroke: #3b6bb5; --fw-fill: #eee3fb; --fw-stroke: #7a52b3; --kernel-fill: #ffe8cc; --kernel-stroke: #b86e14; --user-fill: #dcf3e1; --user-stroke: #3d8a50; --data-fill: #f3f4f6; --data-stroke: #6e7781; --data-filled: #c8d1da; }
    @media (prefers-color-scheme: dark) { svg { --bg: #0d1117; --fg: #e6edf3; --dim: #9198a1; --accent: #ff7b72; --hw-fill: #112d52; --hw-stroke: #58a6ff; --fw-fill: #2c1f4a; --fw-stroke: #b48aff; --kernel-fill: #3d2812; --kernel-stroke: #e3a250; --user-fill: #13301c; --user-stroke: #56c26e; --data-fill: #21262d; --data-stroke: #8b949e; --data-filled: #484f58; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: var(--fg); }
    .small { font-size: 12px; }
    .head { font-weight: 600; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; }
    .dim { fill: var(--dim); }
    .hw { fill: var(--hw-fill); stroke: var(--hw-stroke); }
    .fw { fill: var(--fw-fill); stroke: var(--fw-stroke); }
    .kernel { fill: var(--kernel-fill); stroke: var(--kernel-stroke); }
    .user { fill: var(--user-fill); stroke: var(--user-stroke); }
    .data { fill: var(--data-fill); stroke: var(--data-stroke); }
    .hw, .fw, .kernel, .user, .data { stroke-width: 1.5; }
    .line { stroke: var(--fg); stroke-width: 1.5; fill: none; }
    .dash { stroke-dasharray: 5 4; }
    .accent { stroke: var(--accent); }
    .accent-fill { fill: var(--accent); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--fg)"/>
    </marker>
  </defs>
  <rect width="760" height="285" style="fill: var(--bg)"/>
  <rect x="350" y="24" width="200" height="44" rx="6" class="data"/>
  <text x="450.0" y="51" text-anchor="middle">page tables for this device</text>
  <rect x="24" y="120" width="90" height="50" rx="6" class="user"/>
  <text x="69.0" y="150" text-anchor="middle">driver</text>
  <rect x="200" y="120" width="90" height="50" rx="6" class="hw"/>
  <text x="245.0" y="150" text-anchor="middle">device</text>
  <rect x="400" y="120" width="100" height="50" rx="6" class="hw"/>
  <text x="450.0" y="150" text-anchor="middle">IOMMU</text>
  <rect x="600" y="70" width="136" height="50" rx="6" class="data"/>
  <text x="668.0" y="92" text-anchor="middle">buffers the OS</text>
  <text x="668.0" y="108" text-anchor="middle">mapped in</text>
  <rect x="600" y="180" width="136" height="50" rx="6" class="data"/>
  <text x="668.0" y="210" text-anchor="middle">any other frame</text>
  <path class="line" d="M114,145 H200" marker-end="url(#arrow)"/>
  <text x="157" y="137" text-anchor="middle" class="small">programs</text>
  <path class="line" d="M290,145 H400" marker-end="url(#arrow)"/>
  <text x="345" y="137" text-anchor="middle" class="small">DMA to an IOVA,</text>
  <text x="345" y="163" text-anchor="middle" class="small">carrying its ID</text>
  <path class="line" d="M450,68 V120"/>
  <text x="458" y="98" text-anchor="start" class="small">looked up by ID</text>
  <path class="line" d="M500,135 L600,100" marker-end="url(#arrow)"/>
  <path class="line accent dash" d="M500,155 L600,200" marker-end="url(#arrow)"/>
  <text x="520" y="200" text-anchor="start" class="small">blocked</text>
  <text x="400" y="262" text-anchor="middle" class="small dim">A blocked access is recorded in registers and raises an interrupt to the OS.</text>
</svg>
