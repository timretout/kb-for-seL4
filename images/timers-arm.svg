<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" width="760" height="310" role="img">
  <title>The Arm generic timer and where its rate comes from</title>
  <desc>Firmware sets the rate in CNTFRQ_EL0. One system counter feeds per-core timers, which interrupt the seL4 kernel with a PPI through the GIC. The kernel reads the count but takes its rate from TIMER_FREQUENCY, fixed at build time; user level reads the rate from CNTFRQ_EL0.</desc>
  <style>
    svg { --bg: #ffffff; --fg: #1f2328; --dim: #57606a; --accent: #cf222e; --hw-fill: #ddebff; --hw-stroke: #3b6bb5; --fw-fill: #eee3fb; --fw-stroke: #7a52b3; --kernel-fill: #ffe8cc; --kernel-stroke: #b86e14; --user-fill: #dcf3e1; --user-stroke: #3d8a50; --data-fill: #f3f4f6; --data-stroke: #6e7781; --data-filled: #c8d1da; }
    @media (prefers-color-scheme: dark) { svg { --bg: #0d1117; --fg: #e6edf3; --dim: #9198a1; --accent: #ff7b72; --hw-fill: #112d52; --hw-stroke: #58a6ff; --fw-fill: #2c1f4a; --fw-stroke: #b48aff; --kernel-fill: #3d2812; --kernel-stroke: #e3a250; --user-fill: #13301c; --user-stroke: #56c26e; --data-fill: #21262d; --data-stroke: #8b949e; --data-filled: #484f58; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: var(--fg); }
    .small { font-size: 12px; }
    .head { font-weight: 600; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; }
    .dim { fill: var(--dim); }
    .hw { fill: var(--hw-fill); stroke: var(--hw-stroke); }
    .fw { fill: var(--fw-fill); stroke: var(--fw-stroke); }
    .kernel { fill: var(--kernel-fill); stroke: var(--kernel-stroke); }
    .user { fill: var(--user-fill); stroke: var(--user-stroke); }
    .data { fill: var(--data-fill); stroke: var(--data-stroke); }
    .hw, .fw, .kernel, .user, .data { stroke-width: 1.5; }
    .line { stroke: var(--fg); stroke-width: 1.5; fill: none; }
    .dash { stroke-dasharray: 5 4; }
    .accent { stroke: var(--accent); }
    .accent-fill { fill: var(--accent); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--fg)"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--accent)"/>
    </marker>
  </defs>
  <rect width="760" height="310" style="fill: var(--bg)"/>
  <text x="16" y="28" class="head">Arm: one device, and two places the rate is taken from</text>
  <rect class="fw" x="40" y="60" width="190" height="64" rx="6"/>
  <text x="135" y="86" text-anchor="middle" class="head">Firmware</text>
  <text x="135" y="108" text-anchor="middle" class="small">sets CNTFRQ_EL0 at boot</text>
  <rect class="hw" x="290" y="60" width="230" height="64" rx="6"/>
  <text x="405" y="86" text-anchor="middle" class="head">System counter</text>
  <text x="405" y="108" text-anchor="middle" class="small">64-bit, one per machine</text>
  <rect class="hw" x="580" y="60" width="164" height="64" rx="6"/>
  <text x="662" y="86" text-anchor="middle" class="head">Per-core timers</text>
  <text x="662" y="108" text-anchor="middle" class="small">compare against it</text>
  <path class="line" d="M230,92 H290" marker-end="url(#arrow)"/>
  <path class="line" d="M520,92 H580" marker-end="url(#arrow)"/>

  <rect class="user" x="40" y="226" width="210" height="64" rx="6"/>
  <text x="145" y="252" text-anchor="middle" class="head">User level</text>
  <text x="145" y="274" text-anchor="middle" class="small">rate: reads CNTFRQ_EL0</text>
  <rect class="kernel" x="290" y="226" width="230" height="64" rx="6"/>
  <text x="405" y="252" text-anchor="middle" class="head">seL4 kernel</text>
  <text x="405" y="274" text-anchor="middle" class="small">rate: the build-time constant</text>
  <rect class="data" x="580" y="226" width="164" height="64" rx="6"/>
  <text x="662" y="252" text-anchor="middle" class="mono">TIMER_FREQUENCY</text>
  <text x="662" y="274" text-anchor="middle" class="small">per platform, at build</text>

  <path class="line dash" d="M330,124 L215,226" marker-end="url(#arrow)"/>
  <text x="40" y="170" class="small">count, and the rate</text>
  <text x="40" y="186" class="small">from CNTFRQ_EL0</text>
  <path class="line" d="M380,124 V226" marker-end="url(#arrow)"/>
  <text x="390" y="200" class="small">count</text>
  <path class="line" d="M662,124 V164 H480 V226" marker-end="url(#arrow)"/>
  <text x="571" y="156" text-anchor="middle" class="small">PPI through the GIC</text>
  <path class="line accent" d="M580,258 H520" marker-end="url(#arrow-accent)"/>
</svg>
