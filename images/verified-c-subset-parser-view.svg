<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img">
  <title>What the C parser sees of the kernel</title>
  <desc>In a verified configuration, assembly files, code under a false #ifdef, files the configuration does not compile, and libsel4, the elfloader and user level never reach the C parser. kernel_all.c_pp holds the verified code, the BOOT_CODE functions, which must parse but have no refinement proof, and the bodies marked DONT_TRANSLATE, which the parser skips.</desc>
  <style>
    svg { --bg: #ffffff; --fg: #1f2328; --dim: #57606a; --accent: #cf222e; --hw-fill: #ddebff; --hw-stroke: #3b6bb5; --fw-fill: #eee3fb; --fw-stroke: #7a52b3; --kernel-fill: #ffe8cc; --kernel-stroke: #b86e14; --user-fill: #dcf3e1; --user-stroke: #3d8a50; --data-fill: #f3f4f6; --data-stroke: #6e7781; --data-filled: #c8d1da; }
    @media (prefers-color-scheme: dark) { svg { --bg: #0d1117; --fg: #e6edf3; --dim: #9198a1; --accent: #ff7b72; --hw-fill: #112d52; --hw-stroke: #58a6ff; --fw-fill: #2c1f4a; --fw-stroke: #b48aff; --kernel-fill: #3d2812; --kernel-stroke: #e3a250; --user-fill: #13301c; --user-stroke: #56c26e; --data-fill: #21262d; --data-stroke: #8b949e; --data-filled: #484f58; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: var(--fg); }
    .small { font-size: 12px; }
    .head { font-weight: 600; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; }
    .dim { fill: var(--dim); }
    .hw { fill: var(--hw-fill); stroke: var(--hw-stroke); }
    .fw { fill: var(--fw-fill); stroke: var(--fw-stroke); }
    .kernel { fill: var(--kernel-fill); stroke: var(--kernel-stroke); }
    .user { fill: var(--user-fill); stroke: var(--user-stroke); }
    .data { fill: var(--data-fill); stroke: var(--data-stroke); }
    .hw, .fw, .kernel, .user, .data { stroke-width: 1.5; }
    .line { stroke: var(--fg); stroke-width: 1.5; fill: none; }
    .dash { stroke-dasharray: 5 4; }
    .accent { stroke: var(--accent); }
    .accent-fill { fill: var(--accent); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--fg)"/>
    </marker>
  </defs>
  <rect width="760" height="330" style="fill: var(--bg)"/>

  <rect class="data dash" x="20" y="20" width="262" height="290" rx="6"/>
  <text x="36" y="46" class="head">Never reaches the parser</text>
  <text x="36" y="84">Assembly files (<tspan class="mono">*.S</tspan>)</text>
  <text x="36" y="102" class="small dim">entry, exit, context switch</text>
  <text x="36" y="140">Code under a false <tspan class="mono">#ifdef</tspan></text>
  <text x="36" y="158" class="small dim">SMP, debug printing, benchmarks,</text>
  <text x="36" y="174" class="small dim">most optional features</text>
  <text x="36" y="212">Files not compiled</text>
  <text x="36" y="230" class="small dim">other architectures and platforms' drivers</text>
  <text x="36" y="268">libsel4, the elfloader, user level</text>
  <text x="36" y="286" class="small dim">not part of the kernel image</text>

  <rect class="data" x="306" y="20" width="434" height="290" rx="6"/>
  <text x="322" y="46"><tspan class="mono head">kernel_all.c_pp</tspan>: what the C parser reads</text>

  <rect class="kernel" x="322" y="62" width="402" height="66" rx="6"/>
  <text x="338" y="90" class="head">Verified code</text>
  <text x="338" y="110" class="small">translated by the parser; the code the proofs see</text>

  <rect class="kernel" x="322" y="144" width="402" height="66" rx="6"/>
  <text x="338" y="172"><tspan class="mono head">BOOT_CODE</tspan> <tspan class="head">functions</tspan></text>
  <text x="338" y="192" class="small">must parse, but no refinement proof covers them</text>

  <rect class="kernel dash" x="322" y="226" width="402" height="66" rx="6"/>
  <text x="338" y="254"><tspan class="head">Bodies marked</tspan> <tspan class="mono head">DONT_TRANSLATE</tspan></text>
  <text x="338" y="274" class="small">skipped by the parser; behaviour specified by assumption</text>
</svg>
