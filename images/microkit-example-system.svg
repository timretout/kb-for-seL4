<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 345" width="760" height="345" role="img">
  <title>The example Microkit system</title>
  <desc>The example system description as a picture: a driver protection domain and a client protection domain joined by one channel, sharing one memory region, with the driver also mapping a device region and receiving interrupt 33.</desc>
  <style>
    svg { --bg: #ffffff; --fg: #1f2328; --dim: #57606a; --accent: #cf222e; --hw-fill: #ddebff; --hw-stroke: #3b6bb5; --fw-fill: #eee3fb; --fw-stroke: #7a52b3; --kernel-fill: #ffe8cc; --kernel-stroke: #b86e14; --user-fill: #dcf3e1; --user-stroke: #3d8a50; --data-fill: #f3f4f6; --data-stroke: #6e7781; --data-filled: #c8d1da; }
    @media (prefers-color-scheme: dark) { svg { --bg: #0d1117; --fg: #e6edf3; --dim: #9198a1; --accent: #ff7b72; --hw-fill: #112d52; --hw-stroke: #58a6ff; --fw-fill: #2c1f4a; --fw-stroke: #b48aff; --kernel-fill: #3d2812; --kernel-stroke: #e3a250; --user-fill: #13301c; --user-stroke: #56c26e; --data-fill: #21262d; --data-stroke: #8b949e; --data-filled: #484f58; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: var(--fg); }
    .small { font-size: 12px; }
    .head { font-weight: 600; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; }
    .dim { fill: var(--dim); }
    .hw { fill: var(--hw-fill); stroke: var(--hw-stroke); }
    .fw { fill: var(--fw-fill); stroke: var(--fw-stroke); }
    .kernel { fill: var(--kernel-fill); stroke: var(--kernel-stroke); }
    .user { fill: var(--user-fill); stroke: var(--user-stroke); }
    .data { fill: var(--data-fill); stroke: var(--data-stroke); }
    .hw, .fw, .kernel, .user, .data { stroke-width: 1.5; }
    .line { stroke: var(--fg); stroke-width: 1.5; fill: none; }
    .dash { stroke-dasharray: 5 4; }
    .accent { stroke: var(--accent); }
    .accent-fill { fill: var(--accent); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--fg)"/>
    </marker>
  </defs>
  <rect width="760" height="345" style="fill: var(--bg)"/>
  <rect x="30" y="20" width="140" height="50" rx="6" class="hw"/>
  <text x="40" y="41">region uart</text>
  <text x="40" y="60" class="mono">phys 0x9000000</text>
  <rect x="190" y="20" width="90" height="50" rx="6" class="hw"/>
  <text x="235" y="50" text-anchor="middle">IRQ 33</text>
  <path class="line" d="M100,70 V98" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path class="line" d="M235,70 V98" marker-end="url(#arrow)"/>
  <text x="243" y="90" class="mono">notified(0)</text>
  <rect x="30" y="100" width="250" height="130" rx="6" class="user"/>
  <text x="45" y="124" class="head">driver</text>
  <text x="45" y="144" class="small">priority 200, driver.elf</text>
  <text x="45" y="172" class="mono">uart_base = 0x4000000</text>
  <text x="45" y="194" class="mono">queue = 0x4200000</text>
  <rect x="480" y="100" width="250" height="130" rx="6" class="user"/>
  <text x="495" y="124" class="head">client</text>
  <text x="495" y="144" class="small">priority 100, client.elf</text>
  <text x="495" y="162" class="small">budget 2000, period 10000</text>
  <text x="495" y="194" class="mono">queue = 0x4200000</text>
  <path class="line" d="M280,135 H480" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="380" y="127" text-anchor="middle">channel</text>
  <text x="288" y="153" class="small">id 1</text>
  <text x="472" y="153" class="small" text-anchor="end">id 0, pp</text>
  <path class="line" d="M480,195 H280" marker-end="url(#arrow)"/>
  <text x="380" y="187" class="mono" text-anchor="middle">microkit_ppcall(0, ...)</text>
  <text x="380" y="214" class="small dim" text-anchor="middle">allowed because 200 &gt; 100</text>
  <rect x="290" y="270" width="180" height="54" rx="6" class="data"/>
  <text x="380" y="292" text-anchor="middle">region shared</text>
  <text x="380" y="312" class="mono" text-anchor="middle">size 0x200000</text>
  <path class="line" d="M200,230 V297 H290" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path class="line" d="M560,230 V297 H470" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="192" y="262" class="small" text-anchor="end">mapped rw</text>
  <text x="568" y="262" class="small">mapped rw</text>
</svg>
