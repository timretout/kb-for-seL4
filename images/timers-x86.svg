<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="760" height="450" role="img">
  <title>x86 timers and how they fit together</title>
  <desc>The PIT, a hypervisor CPUID leaf and the HPET have known rates. The per-core local APIC timer and TSC do not: seL4 times both against the PIT at boot, and the hypervisor leaf can give both rates. The kernel takes its interrupt from the local APIC timer and the time from the TSC; user-level drivers use the TSC, the HPET and the PIT.</desc>
  <style>
    svg { --bg: #ffffff; --fg: #1f2328; --dim: #57606a; --accent: #cf222e; --hw-fill: #ddebff; --hw-stroke: #3b6bb5; --fw-fill: #eee3fb; --fw-stroke: #7a52b3; --kernel-fill: #ffe8cc; --kernel-stroke: #b86e14; --user-fill: #dcf3e1; --user-stroke: #3d8a50; --data-fill: #f3f4f6; --data-stroke: #6e7781; --data-filled: #c8d1da; }
    @media (prefers-color-scheme: dark) { svg { --bg: #0d1117; --fg: #e6edf3; --dim: #9198a1; --accent: #ff7b72; --hw-fill: #112d52; --hw-stroke: #58a6ff; --fw-fill: #2c1f4a; --fw-stroke: #b48aff; --kernel-fill: #3d2812; --kernel-stroke: #e3a250; --user-fill: #13301c; --user-stroke: #56c26e; --data-fill: #21262d; --data-stroke: #8b949e; --data-filled: #484f58; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: var(--fg); }
    .small { font-size: 12px; }
    .head { font-weight: 600; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; }
    .dim { fill: var(--dim); }
    .hw { fill: var(--hw-fill); stroke: var(--hw-stroke); }
    .fw { fill: var(--fw-fill); stroke: var(--fw-stroke); }
    .kernel { fill: var(--kernel-fill); stroke: var(--kernel-stroke); }
    .user { fill: var(--user-fill); stroke: var(--user-stroke); }
    .data { fill: var(--data-fill); stroke: var(--data-stroke); }
    .hw, .fw, .kernel, .user, .data { stroke-width: 1.5; }
    .line { stroke: var(--fg); stroke-width: 1.5; fill: none; }
    .dash { stroke-dasharray: 5 4; }
    .accent { stroke: var(--accent); }
    .accent-fill { fill: var(--accent); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--fg)"/>
    </marker>
  </defs>
  <rect width="760" height="450" style="fill: var(--bg)"/>
  <text x="16" y="28" class="head">x86: where each rate comes from, and who uses which device</text>
  <text x="40" y="52" class="small dim">Rate known without measuring</text>
  <rect class="hw" x="40" y="60" width="200" height="64" rx="6"/>
  <text x="140" y="86" text-anchor="middle" class="head">PIT</text>
  <text x="140" y="108" text-anchor="middle" class="small">1 193 182 Hz by convention</text>
  <rect class="fw" x="275" y="60" width="250" height="64" rx="6"/>
  <text x="400" y="86" text-anchor="middle" class="head">Hypervisor CPUID leaf</text>
  <text x="400" y="108" text-anchor="middle" class="mono">0x40000010</text>
  <rect class="hw" x="560" y="60" width="184" height="64" rx="6"/>
  <text x="652" y="86" text-anchor="middle" class="head">HPET</text>
  <text x="652" y="108" text-anchor="middle" class="small">rate in its own register</text>

  <rect class="data dash" x="40" y="194" width="480" height="104" rx="6"/>
  <text x="54" y="213" class="small dim">One of each per core; rate not reported</text>
  <rect class="hw" x="60" y="222" width="210" height="62" rx="6"/>
  <text x="165" y="247" text-anchor="middle" class="head">Local APIC timer</text>
  <text x="165" y="268" text-anchor="middle" class="small">countdown, or TSC deadline</text>
  <rect class="hw" x="300" y="222" width="200" height="62" rx="6"/>
  <text x="400" y="247" text-anchor="middle" class="head">TSC</text>
  <text x="400" y="268" text-anchor="middle" class="small">64-bit counter</text>

  <path class="line" d="M140,124 V194" marker-end="url(#arrow)"/>
  <text x="150" y="156" class="small">seL4 times both</text>
  <text x="150" y="172" class="small">against it at boot</text>
  <path class="line dash" d="M400,124 V194" marker-end="url(#arrow)"/>
  <text x="410" y="156" class="small">can give both rates;</text>
  <text x="410" y="172" class="small">upstream seL4 does not read it</text>

  <rect class="kernel" x="40" y="356" width="300" height="78" rx="6"/>
  <text x="190" y="380" text-anchor="middle" class="head">seL4 kernel</text>
  <text x="190" y="401" text-anchor="middle" class="small">interrupt: local APIC timer</text>
  <text x="190" y="419" text-anchor="middle" class="small">time: TSC</text>
  <rect class="user" x="380" y="356" width="364" height="78" rx="6"/>
  <text x="562" y="380" text-anchor="middle" class="head">User-level timer drivers</text>
  <text x="562" y="401" text-anchor="middle" class="small">util_libs ltimer: HPET, else PIT with TSC</text>
  <text x="562" y="419" text-anchor="middle" class="small">sDDF tsc_hpet: TSC for time, HPET for interrupts</text>

  <path class="line" d="M165,284 V356" marker-end="url(#arrow)"/>
  <text x="175" y="334" class="small">interrupt</text>
  <path class="line" d="M320,284 V356" marker-end="url(#arrow)"/>
  <text x="310" y="334" text-anchor="end" class="small">time</text>
  <path class="line" d="M450,284 V356" marker-end="url(#arrow)"/>
  <text x="460" y="334" class="small">time</text>
  <path class="line" d="M652,124 V356" marker-end="url(#arrow)"/>
  <text x="642" y="318" text-anchor="end" class="small">time and</text>
  <text x="642" y="334" text-anchor="end" class="small">interrupts</text>
</svg>
