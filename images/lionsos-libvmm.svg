<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img">
  <title>A libvmm virtual machine monitor</title>
  <desc>A Linux guest runs beside a VMM protection domain built with libvmm: the kernel delivers guest exits to the VMM as faults, and the guest's virtio devices are implemented in the VMM as clients of sDDF classes.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: #1f2328; }
    .small { font-size: 12px; }
    .head { font-weight: 600; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; }
    .dim { fill: #57606a; }
    .hw { fill: #ddebff; stroke: #3b6bb5; }
    .fw { fill: #eee3fb; stroke: #7a52b3; }
    .kernel { fill: #ffe8cc; stroke: #b86e14; }
    .user { fill: #dcf3e1; stroke: #3d8a50; }
    .data { fill: #f3f4f6; stroke: #6e7781; }
    .hw, .fw, .kernel, .user, .data { stroke-width: 1.5; }
    .line { stroke: #1f2328; stroke-width: 1.5; fill: none; }
    .dash { stroke-dasharray: 5 4; }
    .accent { stroke: #cf222e; }
    .accent-fill { fill: #cf222e; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/>
    </marker>
  </defs>
  <rect width="760" height="300" fill="#ffffff"/>
  <rect x="20" y="30" width="200" height="150" rx="6" class="data"/>
  <text x="35" y="56" class="head">Linux guest</text>
  <text x="35" y="80" class="small">virtio devices:</text>
  <text x="35" y="98" class="small">network, block,</text>
  <text x="35" y="116" class="small">console, sound</text>
  <rect x="300" y="30" width="220" height="150" rx="6" class="user"/>
  <text x="315" y="56" class="head">VMM PD (libvmm)</text>
  <text x="315" y="82" class="mono">fault</text>
  <text x="360" y="82" class="small">entry point</text>
  <text x="315" y="100" class="small">receives guest exits</text>
  <text x="315" y="128" class="mono">src/virtio/</text>
  <text x="315" y="146" class="small">each device a client of</text>
  <text x="315" y="162" class="small">an sDDF class</text>
  <rect x="600" y="30" width="140" height="70" rx="6" class="user"/>
  <text x="670" y="58" class="head" text-anchor="middle">sDDF class</text>
  <text x="670" y="78" class="small" text-anchor="middle">virtualisers, driver</text>
  <rect x="600" y="130" width="140" height="50" rx="6" class="hw"/>
  <text x="670" y="160" text-anchor="middle">device</text>
  <path class="line" d="M520,65 H598" marker-end="url(#arrow)"/>
  <path class="line" d="M670,100 V128" marker-end="url(#arrow)"/>
  <path class="line dash" d="M300,105 H222" marker-end="url(#arrow)"/>
  <text x="261" y="97" class="small" text-anchor="middle">emulates</text>
  <rect x="20" y="240" width="720" height="44" rx="6" class="kernel"/>
  <text x="380" y="267" text-anchor="middle">seL4 kernel: vCPU objects</text>
  <path class="line" d="M120,180 V238" marker-end="url(#arrow)"/>
  <text x="128" y="214" class="small">guest exit</text>
  <path class="line" d="M410,240 V182" marker-end="url(#arrow)"/>
  <text x="418" y="214" class="small">delivered as a fault</text>
</svg>
