<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 414" width="760" height="414" role="img">
  <title>How the kernel C and the specifications meet in l4v</title>
  <desc>The kernel checkout is preprocessed for one verified configuration into kernel_all.c_pp, which the C parser turns into a Simpl program per C function. The design specification is generated from the Haskell prototype. CRefine relates the Simpl program to the design specification and Refine relates the design specification to the abstract specification.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: #1f2328; }
    .small { font-size: 12px; }
    .head { font-weight: 600; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; }
    .dim { fill: #57606a; }
    .hw { fill: #ddebff; stroke: #3b6bb5; }
    .fw { fill: #eee3fb; stroke: #7a52b3; }
    .kernel { fill: #ffe8cc; stroke: #b86e14; }
    .user { fill: #dcf3e1; stroke: #3d8a50; }
    .data { fill: #f3f4f6; stroke: #6e7781; }
    .hw, .fw, .kernel, .user, .data { stroke-width: 1.5; }
    .line { stroke: #1f2328; stroke-width: 1.5; fill: none; }
    .dash { stroke-dasharray: 5 4; }
    .accent { stroke: #cf222e; }
    .accent-fill { fill: #cf222e; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/>
    </marker>
  </defs>
  <rect width="760" height="414" fill="#ffffff"/>

  <rect class="data" x="500" y="24" width="230" height="60" rx="6"/>
  <text x="615" y="49" text-anchor="middle" class="head">abstract specification</text>
  <text x="615" y="70" text-anchor="middle" class="mono">spec/abstract</text>

  <path class="line" d="M615,84 V164"/>
  <text x="603" y="120" text-anchor="end">Refine</text>
  <text x="603" y="139" text-anchor="end" class="mono">proof/refine</text>

  <rect class="data" x="500" y="164" width="230" height="60" rx="6"/>
  <text x="615" y="189" text-anchor="middle" class="head">design specification</text>
  <text x="615" y="210" text-anchor="middle" class="mono">spec/design</text>

  <path class="line" d="M615,224 V330"/>
  <text x="603" y="272" text-anchor="end">CRefine</text>
  <text x="603" y="291" text-anchor="end" class="mono">proof/crefine</text>

  <rect class="data" x="500" y="330" width="230" height="60" rx="6"/>
  <text x="615" y="355" text-anchor="middle" class="head">Simpl program per C function</text>
  <text x="615" y="376" text-anchor="middle" class="small">and a typed model of the heap</text>

  <rect class="data" x="90" y="164" width="160" height="60" rx="6"/>
  <text x="170" y="189" text-anchor="middle" class="head">Haskell prototype</text>
  <text x="170" y="210" text-anchor="middle" class="mono">spec/haskell</text>
  <path class="line" d="M250,194 H498" marker-end="url(#arrow)"/>
  <text x="375" y="185" text-anchor="middle" class="small">generated by</text>
  <text x="375" y="213" text-anchor="middle" class="mono">tools/haskell-translator</text>

  <rect class="kernel" x="30" y="24" width="220" height="60" rx="6"/>
  <text x="140" y="49" text-anchor="middle" class="head">kernel checkout <tspan class="mono" font-weight="400">../seL4</tspan></text>
  <text x="140" y="70" text-anchor="middle" class="small">one verified configuration</text>
  <path class="line" d="M60,84 V328" marker-end="url(#arrow)"/>
  <text x="72" y="262" class="small">CMake target</text>
  <text x="72" y="281" class="mono">kernel_all_pp_wrapper</text>

  <rect class="data" x="30" y="330" width="220" height="60" rx="6"/>
  <text x="140" y="355" text-anchor="middle" class="mono">kernel_all.c_pp</text>
  <text x="140" y="376" text-anchor="middle" class="small">no macros, #ifdefs or includes</text>
  <path class="line" d="M250,360 H498" marker-end="url(#arrow)"/>
  <text x="375" y="351" text-anchor="middle" class="small">C parser</text>
  <text x="375" y="379" text-anchor="middle" class="mono">tools/c-parser</text>
</svg>
