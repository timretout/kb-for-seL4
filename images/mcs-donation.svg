<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 356" width="760" height="356" role="img">
  <title>Scheduling context donation to a passive server</title>
  <desc>A passive server waits on its endpoint with no scheduling context. A client seL4_Call donates the client scheduling context to the server with the message, the server runs on the client budget, and the reply returns the scheduling context to the client.</desc>
  <style>
    svg { --bg: #ffffff; --fg: #1f2328; --dim: #57606a; --accent: #cf222e; --hw-fill: #ddebff; --hw-stroke: #3b6bb5; --fw-fill: #eee3fb; --fw-stroke: #7a52b3; --kernel-fill: #ffe8cc; --kernel-stroke: #b86e14; --user-fill: #dcf3e1; --user-stroke: #3d8a50; --data-fill: #f3f4f6; --data-stroke: #6e7781; --data-filled: #c8d1da; }
    @media (prefers-color-scheme: dark) { svg { --bg: #0d1117; --fg: #e6edf3; --dim: #9198a1; --accent: #ff7b72; --hw-fill: #112d52; --hw-stroke: #58a6ff; --fw-fill: #2c1f4a; --fw-stroke: #b48aff; --kernel-fill: #3d2812; --kernel-stroke: #e3a250; --user-fill: #13301c; --user-stroke: #56c26e; --data-fill: #21262d; --data-stroke: #8b949e; --data-filled: #484f58; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: var(--fg); }
    .small { font-size: 12px; }
    .head { font-weight: 600; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; }
    .dim { fill: var(--dim); }
    .hw { fill: var(--hw-fill); stroke: var(--hw-stroke); }
    .fw { fill: var(--fw-fill); stroke: var(--fw-stroke); }
    .kernel { fill: var(--kernel-fill); stroke: var(--kernel-stroke); }
    .user { fill: var(--user-fill); stroke: var(--user-stroke); }
    .data { fill: var(--data-fill); stroke: var(--data-stroke); }
    .hw, .fw, .kernel, .user, .data { stroke-width: 1.5; }
    .line { stroke: var(--fg); stroke-width: 1.5; fill: none; }
    .dash { stroke-dasharray: 5 4; }
    .accent { stroke: var(--accent); }
    .accent-fill { fill: var(--accent); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--fg)"/>
    </marker>
  </defs>
  <rect width="760" height="356" style="fill: var(--bg)"/>
  <rect x="40" y="20" width="180" height="36" rx="6" class="user"/>
  <text x="130" y="43" text-anchor="middle">client</text>
  <rect x="540" y="20" width="180" height="36" rx="6" class="user"/>
  <text x="630" y="43" text-anchor="middle">passive server</text>
  <path class="line dash" d="M130,56 V340"/>
  <path class="line dash" d="M630,56 V340"/>
  <rect x="80" y="84" width="100" height="30" rx="6" class="kernel"/>
  <text x="130" y="104" text-anchor="middle">SC</text>
  <text x="250" y="104">1. Server waits in seL4_Recv, with no SC</text>
  <path class="line" d="M130,165 H628" marker-end="url(#arrow)"/>
  <text x="380" y="155" text-anchor="middle">2. seL4_Call: the message, and the client's SC is donated</text>
  <text x="380" y="185" class="small dim" text-anchor="middle">the two are linked through the server's Reply object</text>
  <rect x="580" y="205" width="100" height="30" rx="6" class="kernel"/>
  <text x="630" y="225" text-anchor="middle">SC</text>
  <text x="560" y="225" text-anchor="end">3. Runs on the client's budget, at its own priority</text>
  <path class="line" d="M630,280 H132" marker-end="url(#arrow)"/>
  <text x="380" y="270" text-anchor="middle">4. Reply: the SC goes back to the client</text>
  <rect x="80" y="296" width="100" height="30" rx="6" class="kernel"/>
  <text x="130" y="316" text-anchor="middle">SC</text>

</svg>
