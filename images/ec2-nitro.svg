<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img">
  <title>The parts of the EC2 Nitro system</title>
  <desc>An EC2 host holds the instance, the Nitro hypervisor that divides CPUs and memory and emulates the few legacy devices, the Nitro cards that implement network interfaces and disks as PCI functions, and a security chip that controls the host's firmware.</desc>
  <style>
    svg { --bg: #ffffff; --fg: #1f2328; --dim: #57606a; --accent: #cf222e; --hw-fill: #ddebff; --hw-stroke: #3b6bb5; --fw-fill: #eee3fb; --fw-stroke: #7a52b3; --kernel-fill: #ffe8cc; --kernel-stroke: #b86e14; --user-fill: #dcf3e1; --user-stroke: #3d8a50; --data-fill: #f3f4f6; --data-stroke: #6e7781; --data-filled: #c8d1da; }
    @media (prefers-color-scheme: dark) { svg { --bg: #0d1117; --fg: #e6edf3; --dim: #9198a1; --accent: #ff7b72; --hw-fill: #112d52; --hw-stroke: #58a6ff; --fw-fill: #2c1f4a; --fw-stroke: #b48aff; --kernel-fill: #3d2812; --kernel-stroke: #e3a250; --user-fill: #13301c; --user-stroke: #56c26e; --data-fill: #21262d; --data-stroke: #8b949e; --data-filled: #484f58; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: var(--fg); }
    .small { font-size: 12px; }
    .head { font-weight: 600; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; }
    .dim { fill: var(--dim); }
    .hw { fill: var(--hw-fill); stroke: var(--hw-stroke); }
    .fw { fill: var(--fw-fill); stroke: var(--fw-stroke); }
    .kernel { fill: var(--kernel-fill); stroke: var(--kernel-stroke); }
    .user { fill: var(--user-fill); stroke: var(--user-stroke); }
    .data { fill: var(--data-fill); stroke: var(--data-stroke); }
    .hw, .fw, .kernel, .user, .data { stroke-width: 1.5; }
    .line { stroke: var(--fg); stroke-width: 1.5; fill: none; }
    .dash { stroke-dasharray: 5 4; }
    .accent { stroke: var(--accent); }
    .accent-fill { fill: var(--accent); }
    .plain { fill: var(--bg); stroke: var(--data-stroke); stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--fg)"/>
    </marker>
  </defs>
  <rect width="760" height="360" style="fill: var(--bg)"/>
  <rect x="24" y="20" width="712" height="300" rx="6" class="plain"/>
  <text x="40" y="44" class="head">EC2 host server</text>
  <rect x="44" y="60" width="672" height="70" rx="6" class="data"/>
  <text x="60" y="86" class="head">Instance (the guest)</text>
  <text x="60" y="110" class="small">sees a few legacy devices, and all its I/O as two PCI device types with vendor ID 0x1d0f</text>
  <rect x="44" y="190" width="290" height="110" rx="6" class="fw"/>
  <text x="60" y="214" class="head">Nitro hypervisor</text>
  <text x="60" y="238" class="small">derived from Linux's KVM</text>
  <text x="60" y="256" class="small">divides the CPUs and memory</text>
  <text x="60" y="274" class="small">emulates the few legacy devices</text>
  <rect x="374" y="190" width="342" height="70" rx="6" class="hw"/>
  <text x="390" y="214" class="head">Nitro cards</text>
  <text x="390" y="234" class="small">PCIe cards, each with its own Arm processor;</text>
  <text x="390" y="250" class="small">implement the network interfaces and disks</text>
  <rect x="374" y="270" width="342" height="30" rx="6" class="hw"/>
  <text x="390" y="290" class="small">Security chip: controls the host's firmware</text>
  <path class="line" d="M190,132 V188" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="202" y="157" class="small">CPUs, memory,</text>
  <text x="202" y="173" class="small">legacy devices</text>
  <path class="line" d="M545,132 V188" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="557" y="157" class="small">ENA network, NVMe disks,</text>
  <text x="557" y="173" class="small">as PCI functions</text>
  <text x="24" y="342" class="small dim">A metal instance has no hypervisor, but still gets its network and disks from Nitro cards.</text>
</svg>
