<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 352" width="760" height="352" role="img">
  <title>How a VMM gets guest exits on Arm and x86</title>
  <desc>On Arm the guest runs in its own thread, a TCB with a VCPU; an exit the kernel cannot handle becomes fault IPC to the VMM, and the VMM's reply resumes the guest. On x86 the VMM thread calls seL4_VMEnter and becomes the guest until an exit, when the call returns with a fault result, or with a notification result if its bound notification has a signal.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: #1f2328; }
    .small { font-size: 12px; }
    .head { font-weight: 600; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; }
    .dim { fill: #57606a; }
    .hw { fill: #ddebff; stroke: #3b6bb5; }
    .fw { fill: #eee3fb; stroke: #7a52b3; }
    .kernel { fill: #ffe8cc; stroke: #b86e14; }
    .user { fill: #dcf3e1; stroke: #3d8a50; }
    .data { fill: #f3f4f6; stroke: #6e7781; }
    .hw, .fw, .kernel, .user, .data { stroke-width: 1.5; }
    .line { stroke: #1f2328; stroke-width: 1.5; fill: none; }
    .dash { stroke-dasharray: 5 4; }
    .accent { stroke: #cf222e; }
    .accent-fill { fill: #cf222e; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/>
    </marker>
  </defs>
  <rect width="760" height="352" fill="#ffffff"/>
  <text x="195" y="34" text-anchor="middle" class="head">Arm: the VMM is the guest's fault handler</text>
  <text x="565" y="34" text-anchor="middle" class="head">x86: the VMM thread becomes the guest</text>
  <rect x="40" y="50" width="310" height="40" rx="6" class="user"/>
  <text x="195" y="75" text-anchor="middle">VMM thread</text>
  <rect x="40" y="140" width="310" height="40" rx="6" class="kernel"/>
  <text x="195" y="165" text-anchor="middle">seL4 at EL2</text>
  <rect x="40" y="230" width="310" height="40" rx="6" class="data"/>
  <text x="195" y="255" text-anchor="middle">guest thread: TCB with a VCPU</text>
  <rect x="410" y="50" width="310" height="40" rx="6" class="user"/>
  <text x="565" y="75" text-anchor="middle">VMM thread</text>
  <rect x="410" y="140" width="310" height="40" rx="6" class="kernel"/>
  <text x="565" y="165" text-anchor="middle">seL4 in VMX root mode</text>
  <rect x="410" y="230" width="310" height="40" rx="6" class="data"/>
  <text x="565" y="255" text-anchor="middle">the same thread, as the guest</text>
  <path class="line" d="M100,230 V184" marker-end="url(#arrow)"/>
  <text x="108" y="211" text-anchor="start" class="small">exit</text>
  <path class="line" d="M100,140 V94" marker-end="url(#arrow)"/>
  <text x="108" y="121" text-anchor="start" class="small">fault IPC</text>
  <path class="line" d="M250,90 V136" marker-end="url(#arrow)"/>
  <text x="258" y="117" text-anchor="start" class="small">reply</text>
  <path class="line" d="M250,180 V226" marker-end="url(#arrow)"/>
  <text x="258" y="207" text-anchor="start" class="small">resumes</text>
  <path class="line" d="M470,90 V136" marker-end="url(#arrow)"/>
  <text x="478" y="117" text-anchor="start" class="mono">seL4_VMEnter</text>
  <path class="line" d="M470,180 V226" marker-end="url(#arrow)"/>
  <text x="478" y="207" text-anchor="start" class="small">enters guest</text>
  <path class="line" d="M630,230 V184" marker-end="url(#arrow)"/>
  <text x="638" y="211" text-anchor="start" class="small">exit</text>
  <path class="line" d="M630,140 V94" marker-end="url(#arrow)"/>
  <text x="638" y="121" text-anchor="start" class="small">call returns</text>
  <text x="40" y="298" text-anchor="start" class="small">Fault types the VMM sees:</text>
  <text x="40" y="316" text-anchor="start" class="mono">VMFault, VCPUFault,</text>
  <text x="40" y="334" text-anchor="start" class="mono">VGICMaintenance, VPPIEvent</text>
  <text x="410" y="298" text-anchor="start" class="small">Return values:</text>
  <text x="410" y="316" class="small"><tspan class="mono">SEL4_VMENTER_RESULT_FAULT</tspan>: an exit</text>
  <text x="410" y="334" class="small"><tspan class="mono">SEL4_VMENTER_RESULT_NOTIF</tspan>: a signal</text>
</svg>
