<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img">
  <title>One x86-64 system call read two ways</title>
  <desc>The same registers at a syscall instruction, as Linux reads them and as seL4 reads them. Linux takes the system call number from rax and its third argument from rdx; seL4 takes its system call number from rdx, so a Linux third argument of -6 is read as seL4's non-blocking send.</desc>
  <style>
    svg { --bg: #ffffff; --fg: #1f2328; --dim: #57606a; --accent: #cf222e; --hw-fill: #ddebff; --hw-stroke: #3b6bb5; --fw-fill: #eee3fb; --fw-stroke: #7a52b3; --kernel-fill: #ffe8cc; --kernel-stroke: #b86e14; --user-fill: #dcf3e1; --user-stroke: #3d8a50; --data-fill: #f3f4f6; --data-stroke: #6e7781; --data-filled: #c8d1da; }
    @media (prefers-color-scheme: dark) { svg { --bg: #0d1117; --fg: #e6edf3; --dim: #9198a1; --accent: #ff7b72; --hw-fill: #112d52; --hw-stroke: #58a6ff; --fw-fill: #2c1f4a; --fw-stroke: #b48aff; --kernel-fill: #3d2812; --kernel-stroke: #e3a250; --user-fill: #13301c; --user-stroke: #56c26e; --data-fill: #21262d; --data-stroke: #8b949e; --data-filled: #484f58; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: var(--fg); }
    .small { font-size: 12px; }
    .head { font-weight: 600; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; }
    .dim { fill: var(--dim); }
    .hw { fill: var(--hw-fill); stroke: var(--hw-stroke); }
    .fw { fill: var(--fw-fill); stroke: var(--fw-stroke); }
    .kernel { fill: var(--kernel-fill); stroke: var(--kernel-stroke); }
    .user { fill: var(--user-fill); stroke: var(--user-stroke); }
    .data { fill: var(--data-fill); stroke: var(--data-stroke); }
    .hw, .fw, .kernel, .user, .data { stroke-width: 1.5; }
    .line { stroke: var(--fg); stroke-width: 1.5; fill: none; }
    .dash { stroke-dasharray: 5 4; }
    .accent { stroke: var(--accent); }
    .accent-fill { fill: var(--accent); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--fg)"/>
    </marker>
  </defs>
  <rect width="760" height="330" style="fill: var(--bg)"/>

  <text x="24" y="38" class="head">Registers at the</text>
  <text x="24" y="56" class="mono">syscall</text>
  <text x="84" y="56" class="head">instruction</text>

  <!-- register row -->
  <g>
    <rect x="200" y="24" width="130" height="44" rx="6" class="hw"/>
    <text x="265" y="42" text-anchor="middle" class="mono">rax</text>
    <text x="265" y="60" text-anchor="middle" class="mono">1</text>
    <rect x="340" y="24" width="130" height="44" rx="6" class="hw"/>
    <text x="405" y="42" text-anchor="middle" class="mono">rdi</text>
    <text x="405" y="60" text-anchor="middle" class="mono">3</text>
    <rect x="480" y="24" width="130" height="44" rx="6" class="hw"/>
    <text x="545" y="42" text-anchor="middle" class="mono">rsi</text>
    <text x="545" y="60" text-anchor="middle" class="mono">buf</text>
    <rect x="620" y="24" width="120" height="44" rx="6" class="hw accent" style="stroke-width: 2.5"/>
    <text x="680" y="42" text-anchor="middle" class="mono">rdx</text>
    <text x="680" y="60" text-anchor="middle" class="mono">-6</text>
  </g>

  <path class="line dash" d="M265,68 V250"/>
  <path class="line dash" d="M405,68 V250"/>
  <path class="line dash" d="M545,68 V250"/>
  <path class="line dash accent" d="M680,68 V250"/>

  <!-- Linux reading -->
  <text x="24" y="128" class="head">As Linux reads it</text>
  <text x="24" y="146" class="small dim">what the program meant</text>
  <rect x="200" y="106" width="130" height="50" rx="6" class="user"/>
  <text x="265" y="127" text-anchor="middle" class="small">number</text>
  <text x="265" y="146" text-anchor="middle" class="mono">write</text>
  <rect x="340" y="106" width="130" height="50" rx="6" class="user"/>
  <text x="405" y="127" text-anchor="middle" class="small">argument 1</text>
  <text x="405" y="146" text-anchor="middle" class="small">file descriptor</text>
  <rect x="480" y="106" width="130" height="50" rx="6" class="user"/>
  <text x="545" y="127" text-anchor="middle" class="small">argument 2</text>
  <text x="545" y="146" text-anchor="middle" class="small">buffer</text>
  <rect x="620" y="106" width="120" height="50" rx="6" class="user"/>
  <text x="680" y="127" text-anchor="middle" class="small">argument 3</text>
  <text x="680" y="146" text-anchor="middle" class="small">length</text>

  <!-- seL4 reading -->
  <text x="24" y="222" class="head">As seL4 reads it</text>
  <text x="24" y="240" class="small dim">what the kernel does</text>
  <rect x="200" y="200" width="130" height="50" rx="6" class="data"/>
  <text x="265" y="230" text-anchor="middle" class="small dim">not looked at</text>
  <rect x="340" y="200" width="130" height="50" rx="6" class="kernel"/>
  <text x="405" y="221" text-anchor="middle" class="small">capability</text>
  <text x="405" y="240" text-anchor="middle" class="small">to invoke</text>
  <rect x="480" y="200" width="130" height="50" rx="6" class="kernel"/>
  <text x="545" y="221" text-anchor="middle" class="small">message</text>
  <text x="545" y="240" text-anchor="middle" class="small">info</text>
  <rect x="620" y="200" width="120" height="50" rx="6" class="kernel accent" style="stroke-width: 2.5"/>
  <text x="680" y="221" text-anchor="middle" class="small">number</text>
  <text x="680" y="240" text-anchor="middle" class="mono">SysNBSend</text>

  <text x="380" y="286" text-anchor="middle" class="small">A third argument of -6 is the MCS kernel's number for a non-blocking send.</text>
  <text x="380" y="306" text-anchor="middle" class="small">With no valid capability the send does nothing and raises no fault: the call is lost.</text>
</svg>
