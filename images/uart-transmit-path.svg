<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 285" width="760" height="285" role="img">
  <title>The transmit path of a UART</title>
  <desc>The driver writes bytes to a holding register (a FIFO of 16 or more bytes in later UARTs); a shift register clocks them out as bits on one wire, timed by the input clock divided by 16 times the divisor.</desc>
  <style>
    svg { --bg: #ffffff; --fg: #1f2328; --dim: #57606a; --accent: #cf222e; --hw-fill: #ddebff; --hw-stroke: #3b6bb5; --fw-fill: #eee3fb; --fw-stroke: #7a52b3; --kernel-fill: #ffe8cc; --kernel-stroke: #b86e14; --user-fill: #dcf3e1; --user-stroke: #3d8a50; --data-fill: #f3f4f6; --data-stroke: #6e7781; --data-filled: #c8d1da; }
    @media (prefers-color-scheme: dark) { svg { --bg: #0d1117; --fg: #e6edf3; --dim: #9198a1; --accent: #ff7b72; --hw-fill: #112d52; --hw-stroke: #58a6ff; --fw-fill: #2c1f4a; --fw-stroke: #b48aff; --kernel-fill: #3d2812; --kernel-stroke: #e3a250; --user-fill: #13301c; --user-stroke: #56c26e; --data-fill: #21262d; --data-stroke: #8b949e; --data-filled: #484f58; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: var(--fg); }
    .small { font-size: 12px; }
    .head { font-weight: 600; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; }
    .dim { fill: var(--dim); }
    .hw { fill: var(--hw-fill); stroke: var(--hw-stroke); }
    .fw { fill: var(--fw-fill); stroke: var(--fw-stroke); }
    .kernel { fill: var(--kernel-fill); stroke: var(--kernel-stroke); }
    .user { fill: var(--user-fill); stroke: var(--user-stroke); }
    .data { fill: var(--data-fill); stroke: var(--data-stroke); }
    .hw, .fw, .kernel, .user, .data { stroke-width: 1.5; }
    .line { stroke: var(--fg); stroke-width: 1.5; fill: none; }
    .dash { stroke-dasharray: 5 4; }
    .accent { stroke: var(--accent); }
    .accent-fill { fill: var(--accent); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--fg)"/>
    </marker>
  </defs>
  <rect width="760" height="285" style="fill: var(--bg)"/>
  <rect x="24" y="60" width="100" height="56" rx="6" class="data"/>
  <text x="74.0" y="93" text-anchor="middle">driver</text>
  <rect x="190" y="60" width="230" height="56" rx="6" class="hw"/>
  <text x="305.0" y="84" text-anchor="middle">holding register</text>
  <text x="305.0" y="102" text-anchor="middle" class="small">later UARTs: a FIFO of 16 or more bytes</text>
  <rect x="486" y="60" width="150" height="56" rx="6" class="hw"/>
  <text x="561.0" y="93" text-anchor="middle">shift register</text>
  <path class="line" d="M124,88 H190" marker-end="url(#arrow)"/>
  <path class="line" d="M420,88 H486" marker-end="url(#arrow)"/>
  <path class="line" d="M636,88 H740" marker-end="url(#arrow)"/>
  <text x="157" y="80" text-anchor="middle" class="small">bytes</text>
  <text x="688" y="80" text-anchor="middle" class="small">bits, on one wire</text>
  <rect x="190" y="180" width="130" height="50" rx="6" class="hw"/>
  <text x="255.0" y="210" text-anchor="middle">input clock</text>
  <rect x="380" y="180" width="150" height="50" rx="6" class="hw"/>
  <text x="455.0" y="210" text-anchor="middle">÷ (16 × divisor)</text>
  <path class="line" d="M320,205 H380" marker-end="url(#arrow)"/>
  <path class="line" d="M530,205 H561 V116" marker-end="url(#arrow)"/>
  <text x="570" y="170" text-anchor="start" class="small">bit clock, at the baud rate</text>
  <text x="24" y="265" text-anchor="start" class="small dim">The transmitter. The receiver has the reverse.</text>
</svg>
