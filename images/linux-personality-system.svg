<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img">
  <title>A system with a Linux personality in one compartment</title>
  <desc>Above the seL4 kernel sit two groups. A static group, fixed when the system is built, holds the network and disk drivers, the network stack and the file system. A dynamic compartment holds the personality server and the Linux processes it creates. Processes reach only the personality server, by faulting; the server reaches the file system and network stack by IPC.</desc>
  <style>
    svg { --bg: #ffffff; --fg: #1f2328; --dim: #57606a; --accent: #cf222e; --hw-fill: #ddebff; --hw-stroke: #3b6bb5; --fw-fill: #eee3fb; --fw-stroke: #7a52b3; --kernel-fill: #ffe8cc; --kernel-stroke: #b86e14; --user-fill: #dcf3e1; --user-stroke: #3d8a50; --data-fill: #f3f4f6; --data-stroke: #6e7781; --data-filled: #c8d1da; }
    @media (prefers-color-scheme: dark) { svg { --bg: #0d1117; --fg: #e6edf3; --dim: #9198a1; --accent: #ff7b72; --hw-fill: #112d52; --hw-stroke: #58a6ff; --fw-fill: #2c1f4a; --fw-stroke: #b48aff; --kernel-fill: #3d2812; --kernel-stroke: #e3a250; --user-fill: #13301c; --user-stroke: #56c26e; --data-fill: #21262d; --data-stroke: #8b949e; --data-filled: #484f58; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: var(--fg); }
    .small { font-size: 12px; }
    .head { font-weight: 600; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; }
    .dim { fill: var(--dim); }
    .hw { fill: var(--hw-fill); stroke: var(--hw-stroke); }
    .fw { fill: var(--fw-fill); stroke: var(--fw-stroke); }
    .kernel { fill: var(--kernel-fill); stroke: var(--kernel-stroke); }
    .user { fill: var(--user-fill); stroke: var(--user-stroke); }
    .data { fill: var(--data-fill); stroke: var(--data-stroke); }
    .hw, .fw, .kernel, .user, .data { stroke-width: 1.5; }
    .line { stroke: var(--fg); stroke-width: 1.5; fill: none; }
    .dash { stroke-dasharray: 5 4; }
    .accent { stroke: var(--accent); }
    .accent-fill { fill: var(--accent); }
    .group { fill: none; stroke: var(--dim); stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--fg)"/>
    </marker>
  </defs>
  <rect width="760" height="430" style="fill: var(--bg)"/>

  <!-- static group -->
  <rect x="20" y="20" width="340" height="290" rx="6" class="group"/>
  <text x="36" y="44" class="head">Static: fixed when the system is built</text>

  <rect x="40" y="70" width="140" height="50" rx="6" class="user"/>
  <text x="110" y="100" text-anchor="middle">File system</text>
  <rect x="200" y="70" width="140" height="50" rx="6" class="user"/>
  <text x="270" y="100" text-anchor="middle">Network stack</text>

  <rect x="40" y="170" width="140" height="50" rx="6" class="user"/>
  <text x="110" y="200" text-anchor="middle">Disk driver</text>
  <rect x="200" y="170" width="140" height="50" rx="6" class="user"/>
  <text x="270" y="200" text-anchor="middle">Network driver</text>

  <path class="line" d="M110,120 V166" marker-end="url(#arrow)"/>
  <path class="line" d="M270,120 V166" marker-end="url(#arrow)"/>

  <text x="190" y="262" text-anchor="middle" class="small dim">Each is a separate protection domain with</text>
  <text x="190" y="280" text-anchor="middle" class="small dim">only the capabilities its job needs.</text>

  <!-- dynamic compartment -->
  <rect x="400" y="20" width="340" height="290" rx="6" class="group dash accent"/>
  <text x="416" y="44" class="head">Dynamic: one compartment</text>

  <rect x="420" y="70" width="90" height="44" rx="6" class="data"/>
  <text x="465" y="97" text-anchor="middle" class="mono">bash</text>
  <rect x="525" y="70" width="90" height="44" rx="6" class="data"/>
  <text x="570" y="97" text-anchor="middle" class="mono">sshd</text>
  <rect x="630" y="70" width="90" height="44" rx="6" class="data"/>
  <text x="675" y="97" text-anchor="middle" class="mono">ls</text>
  <text x="570" y="136" text-anchor="middle" class="small dim">Linux processes: created and destroyed at run time</text>

  <path class="line" d="M570,146 V186" marker-end="url(#arrow)"/>
  <text x="582" y="172" class="small">system calls, as faults</text>

  <rect x="420" y="190" width="300" height="56" rx="6" class="user"/>
  <text x="570" y="213" text-anchor="middle" class="head">Personality server</text>
  <text x="570" y="233" text-anchor="middle" class="small">owns spare memory, makes the processes</text>

  <text x="570" y="276" text-anchor="middle" class="small dim">Nothing outside this box trusts anything in it.</text>

  <!-- server to static services -->
  <path class="line" d="M420,218 H364" marker-end="url(#arrow)"/>
  <text x="380" y="208" text-anchor="middle" class="small">IPC</text>

  <!-- kernel and hypervisor -->
  <rect x="20" y="330" width="720" height="36" rx="6" class="kernel"/>
  <text x="380" y="353" text-anchor="middle" class="head">seL4 kernel</text>
  <rect x="20" y="376" width="720" height="36" rx="6" class="fw"/>
  <text x="380" y="399" text-anchor="middle">Hypervisor or hardware</text>
</svg>
