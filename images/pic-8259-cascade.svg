<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="760" height="410" role="img">
  <title>The PC/AT's cascaded pair of 8259A interrupt controllers</title>
  <desc>The slave 8259A takes IRQ 8 to 15 and its INT output feeds input 2 of the master, which takes IRQ 0 to 7 and raises INT to the CPU. The master is at I/O ports 0x20 and 0x21, the slave at 0xA0 and 0xA1.</desc>
  <style>
    svg { --bg: #ffffff; --fg: #1f2328; --dim: #57606a; --accent: #cf222e; --hw-fill: #ddebff; --hw-stroke: #3b6bb5; --fw-fill: #eee3fb; --fw-stroke: #7a52b3; --kernel-fill: #ffe8cc; --kernel-stroke: #b86e14; --user-fill: #dcf3e1; --user-stroke: #3d8a50; --data-fill: #f3f4f6; --data-stroke: #6e7781; --data-filled: #c8d1da; }
    @media (prefers-color-scheme: dark) { svg { --bg: #0d1117; --fg: #e6edf3; --dim: #9198a1; --accent: #ff7b72; --hw-fill: #112d52; --hw-stroke: #58a6ff; --fw-fill: #2c1f4a; --fw-stroke: #b48aff; --kernel-fill: #3d2812; --kernel-stroke: #e3a250; --user-fill: #13301c; --user-stroke: #56c26e; --data-fill: #21262d; --data-stroke: #8b949e; --data-filled: #484f58; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: var(--fg); }
    .small { font-size: 12px; }
    .head { font-weight: 600; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; }
    .dim { fill: var(--dim); }
    .hw { fill: var(--hw-fill); stroke: var(--hw-stroke); }
    .fw { fill: var(--fw-fill); stroke: var(--fw-stroke); }
    .kernel { fill: var(--kernel-fill); stroke: var(--kernel-stroke); }
    .user { fill: var(--user-fill); stroke: var(--user-stroke); }
    .data { fill: var(--data-fill); stroke: var(--data-stroke); }
    .hw, .fw, .kernel, .user, .data { stroke-width: 1.5; }
    .line { stroke: var(--fg); stroke-width: 1.5; fill: none; }
    .dash { stroke-dasharray: 5 4; }
    .accent { stroke: var(--accent); }
    .accent-fill { fill: var(--accent); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--fg)"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--accent)"/>
    </marker>
  </defs>
  <rect width="760" height="410" style="fill: var(--bg)"/>
  <rect x="230" y="150" width="120" height="240" rx="6" class="hw"/>
  <text x="290" y="262" text-anchor="middle" class="head">slave</text>
  <text x="290" y="284" text-anchor="middle" class="mono">0xA0 / 0xA1</text>
  <path class="line" d="M212,165 H230"/>
  <text x="206" y="170" text-anchor="end">IRQ 8 RTC</text>
  <path class="line" d="M212,195 H230"/>
  <text x="206" y="200" text-anchor="end">IRQ 9 (ACPI SCI, usually)</text>
  <path class="line" d="M212,225 H230"/>
  <text x="206" y="230" text-anchor="end">IRQ 10 free (PCI)</text>
  <path class="line" d="M212,255 H230"/>
  <text x="206" y="260" text-anchor="end">IRQ 11 free (PCI)</text>
  <path class="line" d="M212,285 H230"/>
  <text x="206" y="290" text-anchor="end">IRQ 12 mouse</text>
  <path class="line" d="M212,315 H230"/>
  <text x="206" y="320" text-anchor="end">IRQ 13 FPU error</text>
  <path class="line" d="M212,345 H230"/>
  <text x="206" y="350" text-anchor="end">IRQ 14 IDE</text>
  <path class="line" d="M212,375 H230"/>
  <text x="206" y="380" text-anchor="end">IRQ 15 IDE</text>
  <rect x="510" y="40" width="120" height="240" rx="6" class="hw"/>
  <text x="570" y="152" text-anchor="middle" class="head">master</text>
  <text x="570" y="174" text-anchor="middle" class="mono">0x20 / 0x21</text>
  <path class="line" d="M492,55 H510"/>
  <text x="486" y="60" text-anchor="end">IRQ 0 timer (PIT)</text>
  <path class="line" d="M492,85 H510"/>
  <text x="486" y="90" text-anchor="end">IRQ 1 keyboard</text>
  <path class="line" d="M492,145 H510"/>
  <text x="486" y="150" text-anchor="end">IRQ 3 COM2</text>
  <path class="line" d="M492,175 H510"/>
  <text x="486" y="180" text-anchor="end">IRQ 4 COM1</text>
  <path class="line" d="M492,205 H510"/>
  <text x="486" y="210" text-anchor="end">IRQ 5</text>
  <path class="line" d="M492,235 H510"/>
  <text x="486" y="240" text-anchor="end">IRQ 6 floppy</text>
  <path class="line" d="M492,265 H510"/>
  <text x="486" y="270" text-anchor="end">IRQ 7 LPT1</text>
  <path class="line accent" d="M350,270 H372 V115 H510" marker-end="url(#arrow-accent)"/>
  <text x="486" y="107" text-anchor="end">IRQ 2: the cascade</text>
  <text x="354" y="290" class="mono">INT</text>
  <path class="line" d="M630,160 H676" marker-end="url(#arrow)"/>
  <text x="653" y="152" text-anchor="middle" class="mono">INT</text>
  <rect x="676" y="138" width="68" height="44" rx="6" class="hw"/>
  <text x="710" y="165" text-anchor="middle">CPU</text>
</svg>
