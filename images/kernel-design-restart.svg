<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img">
  <title>A preempted system call restarts</title>
  <desc>An invocation sets the calling thread to ThreadState_Restart before doing any work. If the operation completes, handleInvocation() turns Restart into Running. If a preemption point fires, the state stays Restart, and when the thread is next chosen activateThread() sets its program counter to the restart address, so it executes the same system call again.</desc>
  <style>
    svg { --bg: #ffffff; --fg: #1f2328; --dim: #57606a; --accent: #cf222e; --hw-fill: #ddebff; --hw-stroke: #3b6bb5; --fw-fill: #eee3fb; --fw-stroke: #7a52b3; --kernel-fill: #ffe8cc; --kernel-stroke: #b86e14; --user-fill: #dcf3e1; --user-stroke: #3d8a50; --data-fill: #f3f4f6; --data-stroke: #6e7781; --data-filled: #c8d1da; }
    @media (prefers-color-scheme: dark) { svg { --bg: #0d1117; --fg: #e6edf3; --dim: #9198a1; --accent: #ff7b72; --hw-fill: #112d52; --hw-stroke: #58a6ff; --fw-fill: #2c1f4a; --fw-stroke: #b48aff; --kernel-fill: #3d2812; --kernel-stroke: #e3a250; --user-fill: #13301c; --user-stroke: #56c26e; --data-fill: #21262d; --data-stroke: #8b949e; --data-filled: #484f58; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: var(--fg); }
    .small { font-size: 12px; }
    .head { font-weight: 600; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; }
    .dim { fill: var(--dim); }
    .hw { fill: var(--hw-fill); stroke: var(--hw-stroke); }
    .fw { fill: var(--fw-fill); stroke: var(--fw-stroke); }
    .kernel { fill: var(--kernel-fill); stroke: var(--kernel-stroke); }
    .user { fill: var(--user-fill); stroke: var(--user-stroke); }
    .data { fill: var(--data-fill); stroke: var(--data-stroke); }
    .hw, .fw, .kernel, .user, .data { stroke-width: 1.5; }
    .line { stroke: var(--fg); stroke-width: 1.5; fill: none; }
    .dash { stroke-dasharray: 5 4; }
    .accent { stroke: var(--accent); }
    .accent-fill { fill: var(--accent); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--fg)"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--accent)"/>
    </marker>
  </defs>
  <rect width="760" height="330" style="fill: var(--bg)"/>
  <rect class="user" x="16" y="24" width="200" height="56" rx="6"/>
  <text x="30" y="47">Thread executes the</text>
  <text x="30" y="67">system call instruction</text>
  <rect class="kernel" x="265" y="24" width="230" height="56" rx="6"/>
  <text x="279" y="47">Decode sets caller's state</text>
  <text x="279" y="67" class="mono">ThreadState_Restart</text>
  <rect class="kernel" x="544" y="24" width="200" height="56" rx="6"/>
  <text x="558" y="47">Operation runs; long loops</text>
  <text x="558" y="67">call <tspan class="mono">preemptionPoint()</tspan></text>
  <path class="line" d="M216,52 H265" marker-end="url(#arrow)"/>
  <path class="line" d="M495,52 H544" marker-end="url(#arrow)"/>
  <path class="line" d="M644,80 V150" marker-end="url(#arrow)"/>
  <text x="652" y="120" class="small">completes</text>
  <path class="line" d="M574,80 V115 H380 V150" marker-end="url(#arrow)"/>
  <text x="392" y="108" class="small">preempted</text>
  <rect class="kernel" x="544" y="150" width="200" height="76" rx="6"/>
  <text x="558" y="173" class="mono">handleInvocation()</text>
  <text x="558" y="193">Restart becomes Running</text>
  <text x="558" y="213" class="small dim">(seL4_Call: writes the reply)</text>
  <rect class="kernel" x="265" y="150" width="230" height="56" rx="6"/>
  <text x="279" y="173" class="mono">EXCEPTION_PREEMPTED</text>
  <text x="279" y="193">state stays Restart</text>
  <path class="line" d="M380,206 V256" marker-end="url(#arrow)"/>
  <text x="388" y="236" class="small">interrupt handled; thread next chosen</text>
  <rect class="kernel" x="235" y="256" width="290" height="56" rx="6"/>
  <text x="249" y="279" class="mono">activateThread()</text>
  <text x="249" y="299">sets the PC to the restart address</text>
  <path class="line accent" d="M235,284 H116 V80" marker-end="url(#arrow-accent)"/>
  <text x="126" y="170" class="small">executes the same</text>
  <text x="126" y="186" class="small">system call again</text>
</svg>
