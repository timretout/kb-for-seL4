<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 396" width="760" height="396" role="img">
  <title>Layout of a TCB object</title>
  <desc>A TCB object of 2^seL4_TCBBits bytes. The TCB capability points to the middle of it, where struct tcb sits; the half below holds five capability slots, numbered 0 to 4, whose contents differ between the non-MCS and MCS kernels.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: #1f2328; }
    .small { font-size: 12px; }
    .head { font-weight: 600; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; }
    .dim { fill: #57606a; }
    .hw { fill: #ddebff; stroke: #3b6bb5; }
    .fw { fill: #eee3fb; stroke: #7a52b3; }
    .kernel { fill: #ffe8cc; stroke: #b86e14; }
    .user { fill: #dcf3e1; stroke: #3d8a50; }
    .data { fill: #f3f4f6; stroke: #6e7781; }
    .hw, .fw, .kernel, .user, .data { stroke-width: 1.5; }
    .line { stroke: #1f2328; stroke-width: 1.5; fill: none; }
    .dash { stroke-dasharray: 5 4; }
    .accent { stroke: #cf222e; }
    .accent-fill { fill: #cf222e; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/>
    </marker>
  </defs>
  <rect width="760" height="396" fill="#ffffff"/>
  <rect x="290" y="20" width="180" height="36" rx="6" class="kernel"/>
  <text x="380" y="43" text-anchor="middle">TCB capability</text>
  <path class="line" d="M380,56 V98" marker-end="url(#arrow)"/>
  <text x="392" y="82" class="small">points to the middle (<tspan class="mono">TCB_OFFSET</tspan>)</text>
  <rect x="40" y="100" width="340" height="56" class="data"/>
  <rect x="40" y="100" width="44" height="56" class="kernel"/>
  <text x="62" y="133" class="mono" text-anchor="middle">0</text>
  <rect x="84" y="100" width="44" height="56" class="kernel"/>
  <text x="106" y="133" class="mono" text-anchor="middle">1</text>
  <rect x="128" y="100" width="44" height="56" class="kernel"/>
  <text x="150" y="133" class="mono" text-anchor="middle">2</text>
  <rect x="172" y="100" width="44" height="56" class="kernel"/>
  <text x="194" y="133" class="mono" text-anchor="middle">3</text>
  <rect x="216" y="100" width="44" height="56" class="kernel"/>
  <text x="238" y="133" class="mono" text-anchor="middle">4</text>
  <text x="320" y="133" class="dim" text-anchor="middle">...</text>
  <rect x="380" y="100" width="340" height="56" class="kernel"/>
  <text x="550" y="133" class="mono" text-anchor="middle">struct tcb</text>
  <path class="line" d="M40,180 H720" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="380" y="200" class="small" text-anchor="middle">one TCB object: 2^seL4_TCBBits bytes</text>
  <text x="40" y="236" class="head">Capability slots</text>
  <text x="40" y="260" class="small dim">slot</text>
  <text x="100" y="260" class="small dim">non-MCS</text>
  <text x="240" y="260" class="small dim">MCS</text>
  <text x="40" y="282" class="mono">0</text>
  <text x="100" y="282" class="mono">tcbCTable</text>
  <text x="240" y="282" class="small dim">same</text>
  <text x="40" y="304" class="mono">1</text>
  <text x="100" y="304" class="mono">tcbVTable</text>
  <text x="240" y="304" class="small dim">same</text>
  <text x="40" y="326" class="mono">2</text>
  <text x="100" y="326" class="mono">tcbReply</text>
  <text x="240" y="326" class="mono">tcbBuffer</text>
  <text x="40" y="348" class="mono">3</text>
  <text x="100" y="348" class="mono">tcbCaller</text>
  <text x="240" y="348" class="mono">tcbFaultHandler</text>
  <text x="40" y="370" class="mono">4</text>
  <text x="100" y="370" class="mono">tcbBuffer</text>
  <text x="240" y="370" class="mono">tcbTimeoutHandler</text>
  <text x="440" y="236" class="head">Fields of <tspan class="mono">struct tcb</tspan>, roughly in order</text>
  <text x="440" y="260" class="mono">tcbArch: saved register context</text>
  <text x="440" y="282" class="mono">tcbState, tcbFlags</text>
  <text x="440" y="304" class="mono">tcbBoundNotification</text>
  <text x="440" y="326" class="mono">tcbFault, tcbLookupFailure</text>
  <text x="440" y="348" class="mono">tcbDomain, tcbMCP, tcbPriority</text>
  <text x="440" y="370" class="mono">...</text>

</svg>
