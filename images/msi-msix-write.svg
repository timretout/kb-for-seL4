<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 295" width="760" height="295" role="img">
  <title>An MSI is a memory write</title>
  <desc>A PCI device interrupts by writing a data value to an address: on x86 the address is in the 0xfee00000 range and names a local APIC, and the data holds the vector; on Arm GICv3 the address is the ITS register GITS_TRANSLATER and the data is an EventID, which the ITS translates to an LPI.</desc>
  <style>
    svg { --bg: #ffffff; --fg: #1f2328; --dim: #57606a; --accent: #cf222e; --hw-fill: #ddebff; --hw-stroke: #3b6bb5; --fw-fill: #eee3fb; --fw-stroke: #7a52b3; --kernel-fill: #ffe8cc; --kernel-stroke: #b86e14; --user-fill: #dcf3e1; --user-stroke: #3d8a50; --data-fill: #f3f4f6; --data-stroke: #6e7781; --data-filled: #c8d1da; }
    @media (prefers-color-scheme: dark) { svg { --bg: #0d1117; --fg: #e6edf3; --dim: #9198a1; --accent: #ff7b72; --hw-fill: #112d52; --hw-stroke: #58a6ff; --fw-fill: #2c1f4a; --fw-stroke: #b48aff; --kernel-fill: #3d2812; --kernel-stroke: #e3a250; --user-fill: #13301c; --user-stroke: #56c26e; --data-fill: #21262d; --data-stroke: #8b949e; --data-filled: #484f58; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: var(--fg); }
    .small { font-size: 12px; }
    .head { font-weight: 600; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; }
    .dim { fill: var(--dim); }
    .hw { fill: var(--hw-fill); stroke: var(--hw-stroke); }
    .fw { fill: var(--fw-fill); stroke: var(--fw-stroke); }
    .kernel { fill: var(--kernel-fill); stroke: var(--kernel-stroke); }
    .user { fill: var(--user-fill); stroke: var(--user-stroke); }
    .data { fill: var(--data-fill); stroke: var(--data-stroke); }
    .hw, .fw, .kernel, .user, .data { stroke-width: 1.5; }
    .line { stroke: var(--fg); stroke-width: 1.5; fill: none; }
    .dash { stroke-dasharray: 5 4; }
    .accent { stroke: var(--accent); }
    .accent-fill { fill: var(--accent); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--fg)"/>
    </marker>
  </defs>
  <rect width="760" height="295" style="fill: var(--bg)"/>
  <text x="30" y="36" text-anchor="start" class="head">x86</text>
  <rect x="30" y="50" width="140" height="60" rx="6" class="hw"/>
  <text x="100.0" y="85" text-anchor="middle">PCI device</text>
  <rect x="450" y="50" width="150" height="60" rx="6" class="hw"/>
  <text x="525.0" y="85" text-anchor="middle">Local APIC</text>
  <path class="line" d="M170,80 H450" marker-end="url(#arrow)"/>
  <text x="310" y="70" text-anchor="middle">address: <tspan class="mono">0xfee00000 range</tspan></text>
  <text x="310" y="98" text-anchor="middle">data: the vector</text>
  <text x="30" y="166" text-anchor="start" class="head">Arm GICv3</text>
  <rect x="30" y="180" width="140" height="60" rx="6" class="hw"/>
  <text x="100.0" y="215" text-anchor="middle">PCI device</text>
  <rect x="450" y="180" width="150" height="60" rx="6" class="hw"/>
  <text x="525.0" y="215" text-anchor="middle">ITS</text>
  <path class="line" d="M170,210 H450" marker-end="url(#arrow)"/>
  <text x="310" y="200" text-anchor="middle">address: <tspan class="mono">GITS_TRANSLATER</tspan></text>
  <text x="310" y="228" text-anchor="middle">data: an EventID</text>
  <path class="line" d="M600,210 H660" marker-end="url(#arrow)"/>
  <rect x="660" y="180" width="70" height="60" rx="6" class="hw"/>
  <text x="695.0" y="215" text-anchor="middle">LPI</text>
  <text x="30" y="275" text-anchor="start" class="small dim">To interrupt, the device writes the data value to the address the OS gave it.</text>
</svg>
