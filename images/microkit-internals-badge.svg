<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" width="760" height="230" role="img">
  <title>How libmicrokit reads the badge</title>
  <desc>The 64-bit badge returned by a receive: bit 62 marks a child fault, bit 63 a protected procedure call, and otherwise bits 0 to 61 are a set of channels that were notified.</desc>
  <style>
    svg { --bg: #ffffff; --fg: #1f2328; --dim: #57606a; --accent: #cf222e; --hw-fill: #ddebff; --hw-stroke: #3b6bb5; --fw-fill: #eee3fb; --fw-stroke: #7a52b3; --kernel-fill: #ffe8cc; --kernel-stroke: #b86e14; --user-fill: #dcf3e1; --user-stroke: #3d8a50; --data-fill: #f3f4f6; --data-stroke: #6e7781; --data-filled: #c8d1da; }
    @media (prefers-color-scheme: dark) { svg { --bg: #0d1117; --fg: #e6edf3; --dim: #9198a1; --accent: #ff7b72; --hw-fill: #112d52; --hw-stroke: #58a6ff; --fw-fill: #2c1f4a; --fw-stroke: #b48aff; --kernel-fill: #3d2812; --kernel-stroke: #e3a250; --user-fill: #13301c; --user-stroke: #56c26e; --data-fill: #21262d; --data-stroke: #8b949e; --data-filled: #484f58; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: var(--fg); }
    .small { font-size: 12px; }
    .head { font-weight: 600; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; }
    .dim { fill: var(--dim); }
    .hw { fill: var(--hw-fill); stroke: var(--hw-stroke); }
    .fw { fill: var(--fw-fill); stroke: var(--fw-stroke); }
    .kernel { fill: var(--kernel-fill); stroke: var(--kernel-stroke); }
    .user { fill: var(--user-fill); stroke: var(--user-stroke); }
    .data { fill: var(--data-fill); stroke: var(--data-stroke); }
    .hw, .fw, .kernel, .user, .data { stroke-width: 1.5; }
    .line { stroke: var(--fg); stroke-width: 1.5; fill: none; }
    .dash { stroke-dasharray: 5 4; }
    .accent { stroke: var(--accent); }
    .accent-fill { fill: var(--accent); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--fg)"/>
    </marker>
  </defs>
  <rect width="760" height="230" style="fill: var(--bg)"/>
  <rect x="40" y="40" width="70" height="44" rx="6" class="kernel"/>
  <text x="75" y="67" class="mono" text-anchor="middle">63</text>
  <rect x="110" y="40" width="70" height="44" rx="6" class="kernel"/>
  <text x="145" y="67" class="mono" text-anchor="middle">62</text>
  <rect x="180" y="40" width="540" height="44" rx="6" class="data"/>
  <text x="450" y="67" text-anchor="middle">bits 61 to 0: one bit per channel</text>
  <text x="40" y="30" class="small dim">badge, 64 bits</text>
  <path class="line" d="M145,84 V112 H196" marker-end="url(#arrow)"/>
  <text x="204" y="117" class="mono">set: fault(badge &amp; 0xff, ...)</text>
  <text x="470" y="117" class="small">a child faulted</text>
  <path class="line" d="M75,84 V147 H196" marker-end="url(#arrow)"/>
  <text x="204" y="152" class="mono">else set: protected(badge &amp; 0x3f, ...)</text>
  <text x="520" y="152" class="small">a protected procedure call</text>
  <path class="line dash" d="M700,84 V182 H640" marker-end="url(#arrow)"/>
  <text x="204" y="187" class="mono">else: notified(i) for each set bit i</text>
  <text x="496" y="187" class="small">notifies and interrupts</text>
  <text x="40" y="216" class="small dim">Bits 62 and 63 are reserved, which leaves 62 usable channel identifiers.</text>
</svg>
