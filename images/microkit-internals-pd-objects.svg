<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img">
  <title>Kernel objects behind a protection domain</title>
  <desc>Each protection domain has one endpoint and one notification, the notification bound to its TCB. A protected procedure call and a child fault arrive on the endpoint; notifies and interrupts arrive on the notification; badges say which.</desc>
  <style>
    svg { --bg: #ffffff; --fg: #1f2328; --dim: #57606a; --accent: #cf222e; --hw-fill: #ddebff; --hw-stroke: #3b6bb5; --fw-fill: #eee3fb; --fw-stroke: #7a52b3; --kernel-fill: #ffe8cc; --kernel-stroke: #b86e14; --user-fill: #dcf3e1; --user-stroke: #3d8a50; --data-fill: #f3f4f6; --data-stroke: #6e7781; --data-filled: #c8d1da; }
    @media (prefers-color-scheme: dark) { svg { --bg: #0d1117; --fg: #e6edf3; --dim: #9198a1; --accent: #ff7b72; --hw-fill: #112d52; --hw-stroke: #58a6ff; --fw-fill: #2c1f4a; --fw-stroke: #b48aff; --kernel-fill: #3d2812; --kernel-stroke: #e3a250; --user-fill: #13301c; --user-stroke: #56c26e; --data-fill: #21262d; --data-stroke: #8b949e; --data-filled: #484f58; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: var(--fg); }
    .small { font-size: 12px; }
    .head { font-weight: 600; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; }
    .dim { fill: var(--dim); }
    .hw { fill: var(--hw-fill); stroke: var(--hw-stroke); }
    .fw { fill: var(--fw-fill); stroke: var(--fw-stroke); }
    .kernel { fill: var(--kernel-fill); stroke: var(--kernel-stroke); }
    .user { fill: var(--user-fill); stroke: var(--user-stroke); }
    .data { fill: var(--data-fill); stroke: var(--data-stroke); }
    .hw, .fw, .kernel, .user, .data { stroke-width: 1.5; }
    .line { stroke: var(--fg); stroke-width: 1.5; fill: none; }
    .dash { stroke-dasharray: 5 4; }
    .accent { stroke: var(--accent); }
    .accent-fill { fill: var(--accent); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--fg)"/>
    </marker>
  </defs>
  <rect width="760" height="400" style="fill: var(--bg)"/>
  <rect x="440" y="20" width="300" height="360" rx="6" class="user"/>
  <text x="455" y="46" class="head">PD B</text>
  <rect x="460" y="70" width="120" height="60" rx="6" class="kernel"/>
  <text x="520" y="105" text-anchor="middle">endpoint</text>
  <rect x="460" y="220" width="120" height="60" rx="6" class="kernel"/>
  <text x="520" y="255" text-anchor="middle">notification</text>
  <rect x="630" y="150" width="90" height="44" rx="6" class="kernel"/>
  <text x="675" y="177" text-anchor="middle">TCB</text>
  <path class="line" d="M580,100 H675 V148" marker-end="url(#arrow)"/>
  <text x="590" y="92" class="small">receives on</text>
  <path class="line dash" d="M580,250 H675 V196" marker-end="url(#arrow)"/>
  <text x="590" y="268" class="small">bound to</text>
  <text x="455" y="318" class="small">Also one each: scheduling context,</text>
  <text x="455" y="336" class="small">VSpace, CNode of fixed layout,</text>
  <text x="455" y="354" class="small">reply object.</text>
  <rect x="20" y="30" width="150" height="44" rx="6" class="user"/>
  <text x="95" y="57" text-anchor="middle">child PD of B</text>
  <rect x="20" y="105" width="150" height="120" rx="6" class="user"/>
  <text x="32" y="165" class="head">PD A</text>
  <text x="32" y="183" class="small">other end of ch</text>
  <text x="162" y="126" class="mono" text-anchor="end">microkit_ppcall</text>
  <text x="162" y="212" class="mono" text-anchor="end">microkit_notify</text>
  <rect x="20" y="270" width="150" height="44" rx="6" class="kernel"/>
  <text x="95" y="297" text-anchor="middle">IRQ handler</text>
  <path class="line" d="M170,52 H410 V85 H458" marker-end="url(#arrow)"/>
  <text x="180" y="44" class="mono">fault: badge 1&lt;&lt;62 | child id</text>
  <path class="line" d="M170,121 H458" marker-end="url(#arrow)"/>
  <text x="180" y="113" class="mono">seL4_Call, badge 1&lt;&lt;63 | id</text>
  <path class="line" d="M170,207 H410 V240 H458" marker-end="url(#arrow)"/>
  <text x="180" y="199" class="mono">seL4_Signal, badge 1&lt;&lt;id</text>
  <path class="line" d="M170,292 H410 V262 H458" marker-end="url(#arrow)"/>
  <text x="180" y="284" class="mono">badge 1&lt;&lt;id</text>
  <text x="20" y="350" class="small dim">Each id is the channel identifier at B.</text>
</svg>
