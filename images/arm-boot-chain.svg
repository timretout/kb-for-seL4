<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="760" height="410" role="img">
  <title>Arm boot chain to the seL4 kernel</title>
  <desc>Boot ROM, BL1 and BL2 run in turn; BL2 loads BL31, which stays resident at EL3, the optional BL32, and BL33, the ordinary bootloader. BL33 starts the seL4 elfloader or Microkit loader, which starts the kernel.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: #1f2328; }
    .small { font-size: 12px; }
    .head { font-weight: 600; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; }
    .dim { fill: #57606a; }
    .hw { fill: #ddebff; stroke: #3b6bb5; }
    .fw { fill: #eee3fb; stroke: #7a52b3; }
    .kernel { fill: #ffe8cc; stroke: #b86e14; }
    .user { fill: #dcf3e1; stroke: #3d8a50; }
    .data { fill: #f3f4f6; stroke: #6e7781; }
    .hw, .fw, .kernel, .user, .data { stroke-width: 1.5; }
    .line { stroke: #1f2328; stroke-width: 1.5; fill: none; }
    .dash { stroke-dasharray: 5 4; }
    .accent { stroke: #cf222e; }
    .accent-fill { fill: #cf222e; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/>
    </marker>
  </defs>
  <rect width="760" height="410" fill="#ffffff"/>
  <rect x="16" y="40" width="140" height="64" rx="6" class="fw"/>
  <text x="86.0" y="68.5" text-anchor="middle" class="head">Boot ROM</text>
  <text x="86.0" y="85.5" text-anchor="middle" class="small">EL3</text>
  <rect x="196" y="40" width="140" height="64" rx="6" class="fw"/>
  <text x="266.0" y="68.5" text-anchor="middle" class="head">BL1</text>
  <text x="266.0" y="85.5" text-anchor="middle" class="small">Trusted ROM, EL3</text>
  <rect x="376" y="40" width="164" height="64" rx="6" class="fw"/>
  <text x="458.0" y="60.0" text-anchor="middle" class="head">BL2</text>
  <text x="458.0" y="77.0" text-anchor="middle" class="small">Trusted Boot Firmware,</text>
  <text x="458.0" y="94.0" text-anchor="middle" class="small">Secure EL1</text>
  <path class="line" d="M156,72 H196" marker-end="url(#arrow)"/>
  <path class="line" d="M336,72 H376" marker-end="url(#arrow)"/>
  <rect x="580" y="34" width="164" height="76" rx="6" class="fw" style="stroke:#cf222e"/>
  <text x="662.0" y="60.0" text-anchor="middle" class="head">BL31</text>
  <text x="662.0" y="77.0" text-anchor="middle" class="small">EL3 Runtime Software</text>
  <text x="662.0" y="94.0" text-anchor="middle" class="small">stays resident</text>
  <rect x="580" y="130" width="164" height="64" rx="6" class="fw" stroke-dasharray="5 4"/>
  <text x="662.0" y="158.5" text-anchor="middle" class="head">BL32 (optional)</text>
  <text x="662.0" y="175.5" text-anchor="middle" class="small">trusted OS, Secure EL1</text>
  <rect x="580" y="214" width="164" height="76" rx="6" class="fw"/>
  <text x="662.0" y="240.0" text-anchor="middle" class="head">BL33</text>
  <text x="662.0" y="257.0" text-anchor="middle" class="small">U-Boot or UEFI</text>
  <text x="662.0" y="274.0" text-anchor="middle" class="small">EL2, or EL1 if no EL2</text>
  <path class="line" d="M540,72 H580" marker-end="url(#arrow)"/>
  <path class="line" d="M560,72 V162 H580" marker-end="url(#arrow)"/>
  <path class="line" d="M560,162 V252 H580" marker-end="url(#arrow)"/>
  <text x="376" y="124" class="small dim">BL2 loads all three</text>
  <rect x="340" y="314" width="200" height="76" rx="6" class="fw"/>
  <text x="440.0" y="340.0" text-anchor="middle" class="head">seL4 elfloader</text>
  <text x="440.0" y="357.0" text-anchor="middle" class="small">or Microkit's loader</text>
  <text x="440.0" y="374.0" text-anchor="middle" class="small">builds page tables, MMU on</text>
  <rect x="40" y="314" width="240" height="76" rx="6" class="kernel"/>
  <text x="160.0" y="340.0" text-anchor="middle" class="head">seL4 kernel</text>
  <text x="160.0" y="357.0" text-anchor="middle" class="small">at EL2 in a hypervisor build,</text>
  <text x="160.0" y="374.0" text-anchor="middle" class="small">otherwise at EL1</text>
  <path class="line" d="M662,290 V352 H540" marker-end="url(#arrow)"/>
  <path class="line" d="M340,352 H280" marker-end="url(#arrow)"/>
  <text x="16" y="150" class="small">BL31 owns EL3 and answers SMC calls:</text>
  <text x="16" y="168" class="small">start and stop cores, reset the machine.</text>
</svg>
