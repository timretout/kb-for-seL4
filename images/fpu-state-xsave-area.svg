<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" width="760" height="200" role="img">
  <title>Layout of the x86 XSAVE area</title>
  <desc>The XSAVE area is a 512-byte legacy area for x87, MMX and SSE, a 64-byte header holding the XSTATE_BV bitmap, then extended components; with AVX the extended part is 256 bytes and the total 832. XCR0 bits 0, 1 and 2 enable x87, SSE and AVX.</desc>
  <style>
    svg { --bg: #ffffff; --fg: #1f2328; --dim: #57606a; --accent: #cf222e; --hw-fill: #ddebff; --hw-stroke: #3b6bb5; --fw-fill: #eee3fb; --fw-stroke: #7a52b3; --kernel-fill: #ffe8cc; --kernel-stroke: #b86e14; --user-fill: #dcf3e1; --user-stroke: #3d8a50; --data-fill: #f3f4f6; --data-stroke: #6e7781; --data-filled: #c8d1da; }
    @media (prefers-color-scheme: dark) { svg { --bg: #0d1117; --fg: #e6edf3; --dim: #9198a1; --accent: #ff7b72; --hw-fill: #112d52; --hw-stroke: #58a6ff; --fw-fill: #2c1f4a; --fw-stroke: #b48aff; --kernel-fill: #3d2812; --kernel-stroke: #e3a250; --user-fill: #13301c; --user-stroke: #56c26e; --data-fill: #21262d; --data-stroke: #8b949e; --data-filled: #484f58; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: var(--fg); }
    .small { font-size: 12px; }
    .head { font-weight: 600; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; }
    .dim { fill: var(--dim); }
    .hw { fill: var(--hw-fill); stroke: var(--hw-stroke); }
    .fw { fill: var(--fw-fill); stroke: var(--fw-stroke); }
    .kernel { fill: var(--kernel-fill); stroke: var(--kernel-stroke); }
    .user { fill: var(--user-fill); stroke: var(--user-stroke); }
    .data { fill: var(--data-fill); stroke: var(--data-stroke); }
    .hw, .fw, .kernel, .user, .data { stroke-width: 1.5; }
    .line { stroke: var(--fg); stroke-width: 1.5; fill: none; }
    .dash { stroke-dasharray: 5 4; }
    .accent { stroke: var(--accent); }
    .accent-fill { fill: var(--accent); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--fg)"/>
    </marker>
  </defs>
  <rect width="760" height="200" style="fill: var(--bg)"/>
  <rect x="24" y="20" width="150" height="30" rx="6" class="hw"/>
  <text x="99" y="40" class="small" text-anchor="middle">XCR0 bit 0: x87</text>
  <rect x="186" y="20" width="150" height="30" rx="6" class="hw"/>
  <text x="261" y="40" class="small" text-anchor="middle">XCR0 bit 1: SSE</text>
  <rect x="563" y="20" width="150" height="30" rx="6" class="hw"/>
  <text x="638" y="40" class="small" text-anchor="middle">XCR0 bit 2: AVX</text>
  <path class="line" d="M99,50 V78" marker-end="url(#arrow)"/>
  <path class="line" d="M261,50 V78" marker-end="url(#arrow)"/>
  <path class="line" d="M638,50 V78" marker-end="url(#arrow)"/>
  <rect x="24" y="80" width="356" height="60" rx="6" class="data"/>
  <text x="202" y="105" text-anchor="middle">legacy area: x87, MMX, SSE</text>
  <text x="202" y="125" class="small" text-anchor="middle">512 bytes, the FXSAVE layout</text>
  <rect x="380" y="80" width="160" height="60" rx="6" class="data"/>
  <text x="460" y="105" text-anchor="middle">header, <tspan class="mono">XSTATE_BV</tspan></text>
  <text x="460" y="125" class="small" text-anchor="middle">64 bytes</text>
  <rect x="540" y="80" width="196" height="60" rx="6" class="data"/>
  <text x="638" y="105" text-anchor="middle">extended: AVX</text>
  <text x="638" y="125" class="small" text-anchor="middle">256 bytes</text>
  <text x="24" y="160" class="mono">0</text>
  <text x="380" y="160" class="mono" text-anchor="middle">512</text>
  <text x="540" y="160" class="mono" text-anchor="middle">576</text>
  <text x="736" y="160" class="mono" text-anchor="end">832</text>
  <text x="24" y="184" class="small dim">Byte offsets for a feature set of 7 (x87 + SSE + AVX). The area is 64-byte aligned.</text>
</svg>
