<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img">
  <title>One Linux system call handled by a personality server</title>
  <desc>A Linux process executes a system call instruction. The seL4 kernel does not know the number, so it sends the process's registers to the fault endpoint. The personality server reads the Linux call from the registers, does the work, and replies with new registers holding the result and an advanced instruction pointer; the kernel resumes the process.</desc>
  <style>
    svg { --bg: #ffffff; --fg: #1f2328; --dim: #57606a; --accent: #cf222e; --hw-fill: #ddebff; --hw-stroke: #3b6bb5; --fw-fill: #eee3fb; --fw-stroke: #7a52b3; --kernel-fill: #ffe8cc; --kernel-stroke: #b86e14; --user-fill: #dcf3e1; --user-stroke: #3d8a50; --data-fill: #f3f4f6; --data-stroke: #6e7781; --data-filled: #c8d1da; }
    @media (prefers-color-scheme: dark) { svg { --bg: #0d1117; --fg: #e6edf3; --dim: #9198a1; --accent: #ff7b72; --hw-fill: #112d52; --hw-stroke: #58a6ff; --fw-fill: #2c1f4a; --fw-stroke: #b48aff; --kernel-fill: #3d2812; --kernel-stroke: #e3a250; --user-fill: #13301c; --user-stroke: #56c26e; --data-fill: #21262d; --data-stroke: #8b949e; --data-filled: #484f58; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: var(--fg); }
    .small { font-size: 12px; }
    .head { font-weight: 600; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; }
    .dim { fill: var(--dim); }
    .hw { fill: var(--hw-fill); stroke: var(--hw-stroke); }
    .fw { fill: var(--fw-fill); stroke: var(--fw-stroke); }
    .kernel { fill: var(--kernel-fill); stroke: var(--kernel-stroke); }
    .user { fill: var(--user-fill); stroke: var(--user-stroke); }
    .data { fill: var(--data-fill); stroke: var(--data-stroke); }
    .hw, .fw, .kernel, .user, .data { stroke-width: 1.5; }
    .line { stroke: var(--fg); stroke-width: 1.5; fill: none; }
    .dash { stroke-dasharray: 5 4; }
    .accent { stroke: var(--accent); }
    .accent-fill { fill: var(--accent); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--fg)"/>
    </marker>
  </defs>
  <rect width="760" height="400" style="fill: var(--bg)"/>

  <rect x="24" y="20" width="200" height="52" rx="6" class="data"/>
  <text x="124" y="42" text-anchor="middle" class="head">Linux process</text>
  <text x="124" y="60" text-anchor="middle" class="small dim">unmodified binary, no capabilities</text>
  <path class="line dash" d="M124,72 V360"/>

  <rect x="290" y="20" width="180" height="52" rx="6" class="kernel"/>
  <text x="380" y="51" text-anchor="middle" class="head">seL4 kernel</text>
  <path class="line dash" d="M380,72 V360"/>

  <rect x="536" y="20" width="200" height="52" rx="6" class="user"/>
  <text x="636" y="42" text-anchor="middle" class="head">Personality server</text>
  <text x="636" y="60" text-anchor="middle" class="small dim">the process's fault handler</text>
  <path class="line dash" d="M636,72 V360"/>

  <path class="line" d="M124,118 H376" marker-end="url(#arrow)"/>
  <text x="250" y="94" text-anchor="middle" class="small">1. system call instruction,</text>
  <text x="250" y="110" text-anchor="middle" class="small">Linux number and arguments in registers</text>

  <text x="388" y="142" text-anchor="start" class="small dim">not one of seL4's numbers:</text>
  <text x="388" y="158" text-anchor="start" class="mono">UnknownSyscall</text>
  <text x="508" y="158" text-anchor="start" class="small dim">fault</text>

  <path class="line" d="M380,196 H632" marker-end="url(#arrow)"/>
  <text x="506" y="188" text-anchor="middle" class="small">2. the process's registers</text>

  <text x="628" y="222" text-anchor="end" class="small dim">3. reads the Linux call from them and</text>
  <text x="628" y="238" text-anchor="end" class="small dim">does the work: its own tables, or a</text>
  <text x="628" y="254" text-anchor="end" class="small dim">request to a file system or network stack</text>

  <path class="line" d="M636,300 H384" marker-end="url(#arrow)"/>
  <text x="510" y="276" text-anchor="middle" class="small">4. reply: result in the return register,</text>
  <text x="510" y="292" text-anchor="middle" class="small">instruction pointer moved past the call</text>

  <path class="line" d="M380,336 H128" marker-end="url(#arrow)"/>
  <text x="254" y="328" text-anchor="middle" class="small">5. resumed with those registers</text>

  <text x="380" y="384" text-anchor="middle" class="small">The process cannot tell that no Linux kernel was involved.</text>
</svg>
