<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350" role="img">
  <title>An sDDF queue between two components</title>
  <desc>A ring of descriptors in shared memory with a tail index written only by the producer and a head index written only by the consumer, a flag the consumer sets to ask for a signal, and a notification the producer sends only when the flag is set.</desc>
  <style>
    svg { --bg: #ffffff; --fg: #1f2328; --dim: #57606a; --accent: #cf222e; --hw-fill: #ddebff; --hw-stroke: #3b6bb5; --fw-fill: #eee3fb; --fw-stroke: #7a52b3; --kernel-fill: #ffe8cc; --kernel-stroke: #b86e14; --user-fill: #dcf3e1; --user-stroke: #3d8a50; --data-fill: #f3f4f6; --data-stroke: #6e7781; --data-filled: #c8d1da; }
    @media (prefers-color-scheme: dark) { svg { --bg: #0d1117; --fg: #e6edf3; --dim: #9198a1; --accent: #ff7b72; --hw-fill: #112d52; --hw-stroke: #58a6ff; --fw-fill: #2c1f4a; --fw-stroke: #b48aff; --kernel-fill: #3d2812; --kernel-stroke: #e3a250; --user-fill: #13301c; --user-stroke: #56c26e; --data-fill: #21262d; --data-stroke: #8b949e; --data-filled: #484f58; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: var(--fg); }
    .small { font-size: 12px; }
    .head { font-weight: 600; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; }
    .dim { fill: var(--dim); }
    .hw { fill: var(--hw-fill); stroke: var(--hw-stroke); }
    .fw { fill: var(--fw-fill); stroke: var(--fw-stroke); }
    .kernel { fill: var(--kernel-fill); stroke: var(--kernel-stroke); }
    .user { fill: var(--user-fill); stroke: var(--user-stroke); }
    .data { fill: var(--data-fill); stroke: var(--data-stroke); }
    .hw, .fw, .kernel, .user, .data { stroke-width: 1.5; }
    .line { stroke: var(--fg); stroke-width: 1.5; fill: none; }
    .dash { stroke-dasharray: 5 4; }
    .accent { stroke: var(--accent); }
    .accent-fill { fill: var(--accent); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--fg)"/>
    </marker>
  </defs>
  <rect width="760" height="350" style="fill: var(--bg)"/>
  <text x="380" y="28" class="small dim" text-anchor="middle">shared memory: one queue</text>
  <rect x="190" y="40" width="380" height="185" rx="6" class="data"/>
  <rect x="20" y="50" width="130" height="180" rx="6" class="user"/>
  <text x="85" y="135" class="head" text-anchor="middle">producer</text>
  <text x="85" y="155" class="small" text-anchor="middle">enqueues</text>
  <rect x="610" y="50" width="130" height="180" rx="6" class="user"/>
  <text x="675" y="135" class="head" text-anchor="middle">consumer</text>
  <text x="675" y="155" class="small" text-anchor="middle">dequeues</text>
  <rect x="220" y="90" width="40" height="30" class="data" style="fill:var(--data-filled)"/>
  <rect x="260" y="90" width="40" height="30" class="data" style="fill:var(--bg)"/>
  <rect x="300" y="90" width="40" height="30" class="data" style="fill:var(--bg)"/>
  <rect x="340" y="90" width="40" height="30" class="data" style="fill:var(--bg)"/>
  <rect x="380" y="90" width="40" height="30" class="data" style="fill:var(--bg)"/>
  <rect x="420" y="90" width="40" height="30" class="data" style="fill:var(--data-filled)"/>
  <rect x="460" y="90" width="40" height="30" class="data" style="fill:var(--data-filled)"/>
  <rect x="500" y="90" width="40" height="30" class="data" style="fill:var(--data-filled)"/>
  <path class="line" d="M150,70 H280 V88" marker-end="url(#arrow)"/>
  <text x="288" y="66" class="mono">tail</text>
  <path class="line" d="M610,70 H440 V88" marker-end="url(#arrow)"/>
  <text x="432" y="66" class="mono" text-anchor="end">head</text>
  <text x="380" y="140" class="small" text-anchor="middle">ring of fixed-size descriptors (shaded: in use)</text>
  <rect x="330" y="165" width="100" height="34" rx="6" class="data" style="fill:var(--bg)"/>
  <text x="380" y="187" text-anchor="middle">flag</text>
  <path class="line dash" d="M150,182 H328" marker-end="url(#arrow)"/>
  <text x="160" y="174" class="small">checks after enqueuing</text>
  <path class="line" d="M610,182 H432" marker-end="url(#arrow)"/>
  <text x="600" y="174" class="small" text-anchor="end">sets: "signal me"</text>
  <path class="line dash" d="M380,225 V250" marker-end="url(#arrow)"/>
  <text x="390" y="243" class="small">descriptors point into</text>
  <rect x="190" y="252" width="380" height="36" rx="6" class="data"/>
  <text x="380" y="275" text-anchor="middle">separate data region</text>
  <path class="line" d="M85,230 V320 H675 V232" marker-end="url(#arrow)"/>
  <text x="380" y="312" text-anchor="middle">notification, sent only if the flag is set</text>
</svg>
