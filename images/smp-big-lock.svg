<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img">
  <title>The SMP kernel: per-core state and one big lock</title>
  <desc>Each core has its own ready queues, current thread and idle thread. Every core takes the one big kernel lock on kernel entry and releases it on exit, so the interrupt tables, domain schedule, ASID tables and all objects stay global. Cores reach each other with reschedule and remote-call IPIs.</desc>
  <style>
    svg { --bg: #ffffff; --fg: #1f2328; --dim: #57606a; --accent: #cf222e; --hw-fill: #ddebff; --hw-stroke: #3b6bb5; --fw-fill: #eee3fb; --fw-stroke: #7a52b3; --kernel-fill: #ffe8cc; --kernel-stroke: #b86e14; --user-fill: #dcf3e1; --user-stroke: #3d8a50; --data-fill: #f3f4f6; --data-stroke: #6e7781; --data-filled: #c8d1da; }
    @media (prefers-color-scheme: dark) { svg { --bg: #0d1117; --fg: #e6edf3; --dim: #9198a1; --accent: #ff7b72; --hw-fill: #112d52; --hw-stroke: #58a6ff; --fw-fill: #2c1f4a; --fw-stroke: #b48aff; --kernel-fill: #3d2812; --kernel-stroke: #e3a250; --user-fill: #13301c; --user-stroke: #56c26e; --data-fill: #21262d; --data-stroke: #8b949e; --data-filled: #484f58; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: var(--fg); }
    .small { font-size: 12px; }
    .head { font-weight: 600; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; }
    .dim { fill: var(--dim); }
    .hw { fill: var(--hw-fill); stroke: var(--hw-stroke); }
    .fw { fill: var(--fw-fill); stroke: var(--fw-stroke); }
    .kernel { fill: var(--kernel-fill); stroke: var(--kernel-stroke); }
    .user { fill: var(--user-fill); stroke: var(--user-stroke); }
    .data { fill: var(--data-fill); stroke: var(--data-stroke); }
    .hw, .fw, .kernel, .user, .data { stroke-width: 1.5; }
    .line { stroke: var(--fg); stroke-width: 1.5; fill: none; }
    .dash { stroke-dasharray: 5 4; }
    .accent { stroke: var(--accent); }
    .accent-fill { fill: var(--accent); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--fg)"/>
    </marker>
  </defs>
  <rect width="760" height="320" style="fill: var(--bg)"/>
  <rect x="30" y="30" width="200" height="40" rx="6" class="hw"/>
  <text x="130" y="55" text-anchor="middle" class="head">Core 0</text>
  <rect x="30" y="100" width="200" height="100" rx="6" class="kernel"/>
  <text x="130" y="122" text-anchor="middle" class="small dim">per-core state</text>
  <text x="130" y="146" text-anchor="middle" class="mono">ksReadyQueues</text>
  <text x="130" y="166" text-anchor="middle" class="mono">ksCurThread</text>
  <text x="130" y="186" text-anchor="middle" class="mono">ksIdleThread</text>
  <rect x="530" y="30" width="200" height="40" rx="6" class="hw"/>
  <text x="630" y="55" text-anchor="middle" class="head">Core 1</text>
  <rect x="530" y="100" width="200" height="100" rx="6" class="kernel"/>
  <text x="630" y="122" text-anchor="middle" class="small dim">per-core state</text>
  <text x="630" y="146" text-anchor="middle" class="mono">ksReadyQueues</text>
  <text x="630" y="166" text-anchor="middle" class="mono">ksCurThread</text>
  <text x="630" y="186" text-anchor="middle" class="mono">ksIdleThread</text>
  <path class="line" d="M234,50 H526" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="380" y="40" text-anchor="middle" class="small">IPIs</text>
  <text x="380" y="68" text-anchor="middle" class="small dim">reschedule, remote call</text>
  <rect x="290" y="130" width="180" height="44" rx="6" class="kernel" style="stroke:var(--accent)"/>
  <text x="380" y="157" text-anchor="middle" class="mono">big_kernel_lock</text>
  <text x="380" y="102" text-anchor="middle" class="small">every core takes it on kernel</text>
  <text x="380" y="118" text-anchor="middle" class="small">entry, releases it on exit</text>
  <path class="line" d="M230,152 H286" marker-end="url(#arrow)"/>
  <path class="line" d="M530,152 H474" marker-end="url(#arrow)"/>
  <path class="line" d="M380,174 V236" marker-end="url(#arrow)"/>
  <rect x="30" y="240" width="700" height="62" rx="6" class="kernel"/>
  <text x="380" y="264" text-anchor="middle" class="small dim">still global: one copy, reached with the lock held</text>
  <text x="380" y="287" text-anchor="middle" class="small">intStateIRQTable, intStateIRQNode, domain schedule, ASID tables, all objects</text>
</svg>
