<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img">
  <title>How secondary cores start on Arm and RISC-V</title>
  <desc>The elfloader on the primary core starts every secondary before jumping to the kernel; each secondary enters the kernel and spins on node_boot_lock until the primary, having finished try_init_kernel, releases it in release_secondary_cpus.</desc>
  <style>
    svg { --bg: #ffffff; --fg: #1f2328; --dim: #57606a; --accent: #cf222e; --hw-fill: #ddebff; --hw-stroke: #3b6bb5; --fw-fill: #eee3fb; --fw-stroke: #7a52b3; --kernel-fill: #ffe8cc; --kernel-stroke: #b86e14; --user-fill: #dcf3e1; --user-stroke: #3d8a50; --data-fill: #f3f4f6; --data-stroke: #6e7781; --data-filled: #c8d1da; }
    @media (prefers-color-scheme: dark) { svg { --bg: #0d1117; --fg: #e6edf3; --dim: #9198a1; --accent: #ff7b72; --hw-fill: #112d52; --hw-stroke: #58a6ff; --fw-fill: #2c1f4a; --fw-stroke: #b48aff; --kernel-fill: #3d2812; --kernel-stroke: #e3a250; --user-fill: #13301c; --user-stroke: #56c26e; --data-fill: #21262d; --data-stroke: #8b949e; --data-filled: #484f58; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: var(--fg); }
    .small { font-size: 12px; }
    .head { font-weight: 600; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; }
    .dim { fill: var(--dim); }
    .hw { fill: var(--hw-fill); stroke: var(--hw-stroke); }
    .fw { fill: var(--fw-fill); stroke: var(--fw-stroke); }
    .kernel { fill: var(--kernel-fill); stroke: var(--kernel-stroke); }
    .user { fill: var(--user-fill); stroke: var(--user-stroke); }
    .data { fill: var(--data-fill); stroke: var(--data-stroke); }
    .hw, .fw, .kernel, .user, .data { stroke-width: 1.5; }
    .line { stroke: var(--fg); stroke-width: 1.5; fill: none; }
    .dash { stroke-dasharray: 5 4; }
    .accent { stroke: var(--accent); }
    .accent-fill { fill: var(--accent); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--fg)"/>
    </marker>
  </defs>
  <rect width="760" height="330" style="fill: var(--bg)"/>
  <rect x="24" y="20" width="306" height="34" rx="6" class="hw"/>
  <text x="177.0" y="42" class="head" text-anchor="middle">Primary core</text>
  <rect x="430" y="20" width="306" height="34" rx="6" class="hw"/>
  <text x="583.0" y="42" class="head" text-anchor="middle">Each secondary core</text>
  <rect x="24" y="74" width="306" height="70" rx="6" class="fw"/>
  <text x="177.0" y="96" class="head" text-anchor="middle">elfloader</text>
  <text x="177.0" y="116" class="small" text-anchor="middle">Arm: <tspan class="mono">psci_cpu_on</tspan>, or another driver</text>
  <text x="177.0" y="134" class="small" text-anchor="middle">RISC-V: <tspan class="mono">sbi_hart_start</tspan></text>
  <path class="line" d="M330,109 H430" marker-end="url(#arrow)"/>
  <text x="380" y="102" class="small" text-anchor="middle">start</text>
  <rect x="430" y="74" width="306" height="70" rx="6" class="fw"/>
  <text x="583.0" y="96" class="head" text-anchor="middle">elfloader</text>
  <text x="583.0" y="116" class="small" text-anchor="middle">Arm: <tspan class="mono">secondary_startup</tspan>, MMU on,</text>
  <text x="583.0" y="134" class="small" text-anchor="middle">jump to the kernel entry</text>
  <path class="line" d="M177.0,144 V170" marker-end="url(#arrow)"/>
  <path class="line" d="M583.0,144 V170" marker-end="url(#arrow)"/>
  <rect x="24" y="170" width="306" height="50" rx="6" class="kernel"/>
  <text x="177.0" y="192" class="mono" text-anchor="middle">try_init_kernel</text>
  <text x="177.0" y="210" class="small" text-anchor="middle">the primary initialises the kernel</text>
  <path class="line" d="M177.0,220 V246" marker-end="url(#arrow)"/>
  <rect x="24" y="246" width="306" height="66" rx="6" class="kernel"/>
  <text x="177.0" y="268" class="mono" text-anchor="middle">release_secondary_cpus</text>
  <text x="177.0" y="286" class="small" text-anchor="middle">sets the lock, waits until ksNumCPUs</text>
  <text x="177.0" y="302" class="small" text-anchor="middle">equals CONFIG_MAX_NUM_NODES</text>
  <rect x="430" y="170" width="306" height="142" rx="6" class="kernel"/>
  <text x="583.0" y="192" class="mono" text-anchor="middle">try_init_kernel_secondary_core</text>
  <text x="583.0" y="212" class="small" text-anchor="middle">spins on <tspan class="mono">node_boot_lock</tspan></text>
  <path class="line dash" d="M330,279 H430" marker-end="url(#arrow)"/>
  <text x="380" y="272" class="small" text-anchor="middle">lock set</text>
</svg>
