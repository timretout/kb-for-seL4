<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 610" width="760" height="610" role="img">
  <title>seL4 kernel entry and exit on AArch64</title>
  <desc>From a user thread at EL0, the processor takes an exception and enters the vector table; kernel_enter saves the registers into the TCB that sp already points at, lsp_i loads the kernel stack from TPIDR, a C handler runs, and restore_user_context returns with eret.</desc>
  <style>
    svg { --bg: #ffffff; --fg: #1f2328; --dim: #57606a; --accent: #cf222e; --hw-fill: #ddebff; --hw-stroke: #3b6bb5; --fw-fill: #eee3fb; --fw-stroke: #7a52b3; --kernel-fill: #ffe8cc; --kernel-stroke: #b86e14; --user-fill: #dcf3e1; --user-stroke: #3d8a50; --data-fill: #f3f4f6; --data-stroke: #6e7781; --data-filled: #c8d1da; }
    @media (prefers-color-scheme: dark) { svg { --bg: #0d1117; --fg: #e6edf3; --dim: #9198a1; --accent: #ff7b72; --hw-fill: #112d52; --hw-stroke: #58a6ff; --fw-fill: #2c1f4a; --fw-stroke: #b48aff; --kernel-fill: #3d2812; --kernel-stroke: #e3a250; --user-fill: #13301c; --user-stroke: #56c26e; --data-fill: #21262d; --data-stroke: #8b949e; --data-filled: #484f58; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: var(--fg); }
    .small { font-size: 12px; }
    .head { font-weight: 600; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; }
    .dim { fill: var(--dim); }
    .hw { fill: var(--hw-fill); stroke: var(--hw-stroke); }
    .fw { fill: var(--fw-fill); stroke: var(--fw-stroke); }
    .kernel { fill: var(--kernel-fill); stroke: var(--kernel-stroke); }
    .user { fill: var(--user-fill); stroke: var(--user-stroke); }
    .data { fill: var(--data-fill); stroke: var(--data-stroke); }
    .hw, .fw, .kernel, .user, .data { stroke-width: 1.5; }
    .line { stroke: var(--fg); stroke-width: 1.5; fill: none; }
    .dash { stroke-dasharray: 5 4; }
    .accent { stroke: var(--accent); }
    .accent-fill { fill: var(--accent); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--fg)"/>
    </marker>
  </defs>
  <rect width="760" height="610" style="fill: var(--bg)"/>
  <rect x="30" y="20" width="420" height="54" rx="6" class="user"/>
  <text x="240.0" y="43.5" text-anchor="middle">User thread runs at EL0</text>
  <text x="240.0" y="60.5" text-anchor="middle" class="small">the kernel's sp (SP_EL1) points at its saved registers</text>
  <rect x="30" y="100" width="420" height="72" rx="6" class="hw"/>
  <text x="240.0" y="124.0" text-anchor="middle" class="head">Processor takes the exception</text>
  <text x="240.0" y="141.0" text-anchor="middle" class="small">PSTATE → SPSR, return address → ELR, reason → ESR</text>
  <text x="240.0" y="158.0" text-anchor="middle" class="small">D, A, I, F masked; SP becomes SP_ELx</text>
  <rect x="30" y="198" width="420" height="54" rx="6" class="kernel"/>
  <text x="240.0" y="221.5" text-anchor="middle" class="mono">arm_vector_table</text>
  <text x="240.0" y="238.5" text-anchor="middle" class="small">lower_el_sync or lower_el_irq</text>
  <rect x="30" y="278" width="420" height="54" rx="6" class="kernel"/>
  <text x="240.0" y="301.5" text-anchor="middle" class="mono">kernel_enter</text>
  <text x="240.0" y="318.5" text-anchor="middle" class="small">stores X0 to X30, SP_EL0, ELR, SPSR at offsets from sp</text>
  <rect x="30" y="358" width="420" height="54" rx="6" class="kernel"/>
  <text x="240.0" y="381.5" text-anchor="middle" class="mono">lsp_i</text>
  <text x="240.0" y="398.5" text-anchor="middle" class="small">sp ← TPIDR, the top of this core's kernel stack</text>
  <rect x="30" y="438" width="420" height="54" rx="6" class="kernel"/>
  <text x="240.0" y="461.5" text-anchor="middle">C handler</text>
  <text x="240.0" y="478.5" text-anchor="middle" class="small">c_handle_syscall, c_handle_interrupt, ...</text>
  <rect x="30" y="518" width="420" height="72" rx="6" class="kernel"/>
  <text x="240.0" y="542.0" text-anchor="middle" class="mono">restore_user_context</text>
  <text x="240.0" y="559.0" text-anchor="middle" class="small">sp ← current thread's register array;</text>
  <text x="240.0" y="576.0" text-anchor="middle" class="small">loads SP_EL0, ELR, SPSR, X0 to X30; eret</text>
  <path class="line" d="M240,74 V100" marker-end="url(#arrow)"/>
  <path class="line" d="M240,172 V198" marker-end="url(#arrow)"/>
  <path class="line" d="M240,252 V278" marker-end="url(#arrow)"/>
  <path class="line" d="M240,332 V358" marker-end="url(#arrow)"/>
  <path class="line" d="M240,412 V438" marker-end="url(#arrow)"/>
  <path class="line" d="M240,492 V518" marker-end="url(#arrow)"/>
  <path class="line" d="M30,554 H16 V47 H30" marker-end="url(#arrow)"/>
  <rect x="520" y="278" width="224" height="54" rx="6" class="data"/>
  <text x="632.0" y="301.5" text-anchor="middle">TCB of the current thread</text>
  <text x="632.0" y="318.5" text-anchor="middle" class="small">saved-register array</text>
  <rect x="520" y="358" width="224" height="54" rx="6" class="data"/>
  <text x="632.0" y="381.5" text-anchor="middle">Kernel stack</text>
  <text x="632.0" y="398.5" text-anchor="middle" class="small">one per core, empty on entry</text>
  <path class="line" d="M450,305 H520" marker-end="url(#arrow)"/>
  <path class="line" d="M520,385 H450" marker-end="url(#arrow)"/>
</svg>
