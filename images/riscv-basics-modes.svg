<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img">
  <title>RISC-V modes as seL4 uses them</title>
  <desc>OpenSBI runs in M-mode, the elfloader and then the seL4 kernel in S-mode, and user threads in U-mode. An ecall from U-mode is an seL4 system call; an ecall from S-mode is an SBI call to OpenSBI.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: #1f2328; }
    .small { font-size: 12px; }
    .head { font-weight: 600; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; }
    .dim { fill: #57606a; }
    .hw { fill: #ddebff; stroke: #3b6bb5; }
    .fw { fill: #eee3fb; stroke: #7a52b3; }
    .kernel { fill: #ffe8cc; stroke: #b86e14; }
    .user { fill: #dcf3e1; stroke: #3d8a50; }
    .data { fill: #f3f4f6; stroke: #6e7781; }
    .hw, .fw, .kernel, .user, .data { stroke-width: 1.5; }
    .line { stroke: #1f2328; stroke-width: 1.5; fill: none; }
    .dash { stroke-dasharray: 5 4; }
    .accent { stroke: #cf222e; }
    .accent-fill { fill: #cf222e; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/>
    </marker>
  </defs>
  <rect width="760" height="320" fill="#ffffff"/>
  <text x="16" y="78" class="head">U-mode</text>
  <text x="16" y="178" class="head">S-mode</text>
  <text x="16" y="278" class="head">M-mode</text>
  <rect x="460" y="45" width="284" height="56" rx="6" class="user"/>
  <text x="602.0" y="78.0" text-anchor="middle" class="head">User threads</text>
  <rect x="460" y="145" width="284" height="56" rx="6" class="kernel"/>
  <text x="602.0" y="178.0" text-anchor="middle" class="head">seL4 kernel</text>
  <rect x="100" y="145" width="190" height="56" rx="6" class="fw"/>
  <text x="195.0" y="169.5" text-anchor="middle" class="head">elfloader</text>
  <text x="195.0" y="186.5" text-anchor="middle" class="small">or the Microkit loader</text>
  <rect x="100" y="245" width="644" height="56" rx="6" class="fw"/>
  <text x="422.0" y="269.5" text-anchor="middle" class="head">OpenSBI</text>
  <text x="422.0" y="286.5" text-anchor="middle" class="small">firmware: answers SBI calls</text>
  <path class="line" d="M195,245 V201" marker-end="url(#arrow)"/>
  <text x="205" y="228" class="small">starts first, then the loader</text>
  <path class="line" d="M290,173 H460" marker-end="url(#arrow)"/>
  <text x="375" y="163" text-anchor="middle" class="small">jumps to _start</text>
  <path class="line" d="M540,101 V145" marker-end="url(#arrow)"/>
  <text x="550" y="128" class="small">ecall: seL4 system call</text>
  <path class="line" d="M540,201 V245" marker-end="url(#arrow)"/>
  <text x="550" y="228" class="small">ecall: SBI call (legacy)</text>
</svg>
