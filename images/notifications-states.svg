<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 245" width="760" height="245" role="img">
  <title>Notification states</title>
  <desc>A notification is Idle, Waiting or Active. Wait on an Idle notification makes it Waiting; a Signal then runs the head waiter with the badge. Signal on an Idle notification makes it Active, further signals OR more bits in, and Wait or Poll returns the word, clears it and goes back to Idle.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: #1f2328; }
    .small { font-size: 12px; }
    .head { font-weight: 600; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; }
    .dim { fill: #57606a; }
    .hw { fill: #ddebff; stroke: #3b6bb5; }
    .fw { fill: #eee3fb; stroke: #7a52b3; }
    .kernel { fill: #ffe8cc; stroke: #b86e14; }
    .user { fill: #dcf3e1; stroke: #3d8a50; }
    .data { fill: #f3f4f6; stroke: #6e7781; }
    .hw, .fw, .kernel, .user, .data { stroke-width: 1.5; }
    .line { stroke: #1f2328; stroke-width: 1.5; fill: none; }
    .dash { stroke-dasharray: 5 4; }
    .accent { stroke: #cf222e; }
    .accent-fill { fill: #cf222e; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/>
    </marker>
  </defs>
  <rect width="760" height="245" fill="#ffffff"/>
  <rect x="30" y="120" width="180" height="60" rx="6" class="kernel"/>
  <text x="120" y="145" text-anchor="middle" class="head">Waiting</text>
  <text x="120" y="165" text-anchor="middle" class="small dim">queue of blocked TCBs</text>
  <rect x="290" y="120" width="180" height="60" rx="6" class="kernel"/>
  <text x="380" y="145" text-anchor="middle" class="head">Idle</text>
  <text x="380" y="165" text-anchor="middle" class="small dim">nothing pending, no waiter</text>
  <rect x="550" y="120" width="180" height="60" rx="6" class="kernel"/>
  <text x="640" y="145" text-anchor="middle" class="head">Active</text>
  <text x="640" y="165" text-anchor="middle" class="small dim">word holds the ORed badges</text>
  <path class="line" d="M290,138 H214" marker-end="url(#arrow)"/>
  <text x="250" y="130" text-anchor="middle">Wait</text>
  <path class="line" d="M210,162 H286" marker-end="url(#arrow)"/>
  <text x="250" y="205" text-anchor="middle" class="small">Signal: the head waiter runs with the</text>
  <text x="250" y="221" text-anchor="middle" class="small">badge; Idle when the queue empties</text>
  <path class="line" d="M470,138 H546" marker-end="url(#arrow)"/>
  <text x="510" y="130" text-anchor="middle">Signal</text>
  <path class="line" d="M550,162 H474" marker-end="url(#arrow)"/>
  <text x="510" y="205" text-anchor="middle" class="small">Wait or Poll:</text>
  <text x="510" y="221" text-anchor="middle" class="small">return word, clear</text>
  <path class="line" d="M600,120 C600,70 680,70 680,116" marker-end="url(#arrow)"/>
  <text x="640" y="62" text-anchor="middle">Signal: ORs more bits in</text>
</svg>
