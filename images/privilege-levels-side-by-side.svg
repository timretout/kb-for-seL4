<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img">
  <title>Privilege levels on x86, Arm and RISC-V</title>
  <desc>The levels of x86, Arm and RISC-V in rows by role, from application down to run-time firmware, with the levels seL4 runs in marked: ring 0, EL1 or EL2, and S-mode.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: #1f2328; }
    .small { font-size: 12px; }
    .head { font-weight: 600; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; }
    .dim { fill: #57606a; }
    .hw { fill: #ddebff; stroke: #3b6bb5; }
    .fw { fill: #eee3fb; stroke: #7a52b3; }
    .kernel { fill: #ffe8cc; stroke: #b86e14; }
    .user { fill: #dcf3e1; stroke: #3d8a50; }
    .data { fill: #f3f4f6; stroke: #6e7781; }
    .hw, .fw, .kernel, .user, .data { stroke-width: 1.5; }
    .line { stroke: #1f2328; stroke-width: 1.5; fill: none; }
    .dash { stroke-dasharray: 5 4; }
    .accent { stroke: #cf222e; }
    .accent-fill { fill: #cf222e; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/>
    </marker>
  </defs>
  <rect width="760" height="330" fill="#ffffff"/>
  <text x="264" y="36" class="head" text-anchor="middle">x86</text>
  <text x="452" y="36" class="head" text-anchor="middle">Arm</text>
  <text x="640" y="36" class="head" text-anchor="middle">RISC-V</text>
  <text x="44" y="77">Application</text>
  <rect x="176" y="52" width="176" height="40" rx="6" class="user"/>
  <text x="264" y="77" text-anchor="middle">ring 3</text>
  <rect x="364" y="52" width="176" height="40" rx="6" class="user"/>
  <text x="452" y="77" text-anchor="middle">EL0</text>
  <rect x="552" y="52" width="176" height="40" rx="6" class="user"/>
  <text x="640" y="77" text-anchor="middle">U</text>
  <text x="44" y="131">Kernel</text>
  <rect x="176" y="106" width="176" height="40" rx="6" class="kernel"/>
  <text x="264" y="131" text-anchor="middle">ring 0</text>
  <rect x="364" y="106" width="176" height="40" rx="6" class="kernel"/>
  <text x="452" y="131" text-anchor="middle">EL1</text>
  <rect x="552" y="106" width="176" height="40" rx="6" class="kernel"/>
  <text x="640" y="131" text-anchor="middle">S</text>
  <text x="44" y="185">Hypervisor</text>
  <rect x="176" y="160" width="176" height="40" rx="6" class="kernel"/>
  <text x="264" y="185" text-anchor="middle">VMX root ring 0</text>
  <rect x="364" y="160" width="176" height="40" rx="6" class="kernel"/>
  <text x="452" y="185" text-anchor="middle">EL2</text>
  <rect x="552" y="160" width="176" height="40" rx="6" class="fw"/>
  <text x="640" y="185" text-anchor="middle">HS</text>
  <text x="44" y="239">Firmware at</text>
  <rect x="176" y="214" width="176" height="40" rx="6" class="fw"/>
  <text x="264" y="239" text-anchor="middle">SMM</text>
  <rect x="364" y="214" width="176" height="40" rx="6" class="fw"/>
  <text x="452" y="239" text-anchor="middle">EL3 (secure monitor)</text>
  <rect x="552" y="214" width="176" height="40" rx="6" class="fw"/>
  <text x="640" y="239" text-anchor="middle">M</text>
  <text x="44" y="257">run time</text>
  <path class="line" d="M30,56 V250" marker-end="url(#arrow)"/>
  <text x="24" y="282" class="small">Orange: where seL4 runs. x86: ring 0, in VMX root if <tspan class="mono">KernelVTX</tspan>. Arm: EL1, or EL2 when built with</text>
  <text x="24" y="302" class="small"><tspan class="mono">KernelArmHypervisorSupport</tspan>. RISC-V: S-mode. The arrow points towards more privilege.</text>
</svg>
