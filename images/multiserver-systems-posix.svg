<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img">
  <title>Two places to put POSIX above a microkernel</title>
  <desc>On the left, the Hurd's arrangement: the C library inside each program turns POSIX calls into messages sent directly to several servers. On the right, a personality server: the program and its C library are unchanged, system calls trap to one server, and that server sends messages to the others.</desc>
  <style>
    svg { --bg: #ffffff; --fg: #1f2328; --dim: #57606a; --accent: #cf222e; --hw-fill: #ddebff; --hw-stroke: #3b6bb5; --fw-fill: #eee3fb; --fw-stroke: #7a52b3; --kernel-fill: #ffe8cc; --kernel-stroke: #b86e14; --user-fill: #dcf3e1; --user-stroke: #3d8a50; --data-fill: #f3f4f6; --data-stroke: #6e7781; --data-filled: #c8d1da; }
    @media (prefers-color-scheme: dark) { svg { --bg: #0d1117; --fg: #e6edf3; --dim: #9198a1; --accent: #ff7b72; --hw-fill: #112d52; --hw-stroke: #58a6ff; --fw-fill: #2c1f4a; --fw-stroke: #b48aff; --kernel-fill: #3d2812; --kernel-stroke: #e3a250; --user-fill: #13301c; --user-stroke: #56c26e; --data-fill: #21262d; --data-stroke: #8b949e; --data-filled: #484f58; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: var(--fg); }
    .small { font-size: 12px; }
    .head { font-weight: 600; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; }
    .dim { fill: var(--dim); }
    .hw { fill: var(--hw-fill); stroke: var(--hw-stroke); }
    .fw { fill: var(--fw-fill); stroke: var(--fw-stroke); }
    .kernel { fill: var(--kernel-fill); stroke: var(--kernel-stroke); }
    .user { fill: var(--user-fill); stroke: var(--user-stroke); }
    .data { fill: var(--data-fill); stroke: var(--data-stroke); }
    .hw, .fw, .kernel, .user, .data { stroke-width: 1.5; }
    .line { stroke: var(--fg); stroke-width: 1.5; fill: none; }
    .dash { stroke-dasharray: 5 4; }
    .accent { stroke: var(--accent); }
    .accent-fill { fill: var(--accent); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--fg)"/>
    </marker>
  </defs>
  <rect width="760" height="400" style="fill: var(--bg)"/>

  <!-- left: library -->
  <text x="190" y="34" text-anchor="middle" class="head">In the C library (the Hurd)</text>

  <rect x="50" y="52" width="280" height="96" rx="6" class="data"/>
  <text x="190" y="76" text-anchor="middle">Program, rebuilt for this system</text>
  <rect x="66" y="92" width="248" height="42" rx="6" class="data accent" style="stroke-width: 2.5"/>
  <text x="190" y="118" text-anchor="middle" class="small">C library: POSIX calls become messages</text>

  <path class="line" d="M100,148 V226" marker-end="url(#arrow)"/>
  <path class="line" d="M190,148 V226" marker-end="url(#arrow)"/>
  <path class="line" d="M280,148 V226" marker-end="url(#arrow)"/>
  <text x="198" y="192" class="small">messages</text>

  <rect x="50" y="230" width="90" height="50" rx="6" class="user"/>
  <text x="95" y="251" text-anchor="middle" class="small">file</text>
  <text x="95" y="268" text-anchor="middle" class="small">system</text>
  <rect x="150" y="230" width="80" height="50" rx="6" class="user"/>
  <text x="190" y="260" text-anchor="middle" class="mono">proc</text>
  <rect x="240" y="230" width="90" height="50" rx="6" class="user"/>
  <text x="285" y="260" text-anchor="middle" class="mono">auth</text>

  <text x="190" y="308" text-anchor="middle" class="small dim">The program holds the means to reach</text>
  <text x="190" y="326" text-anchor="middle" class="small dim">each server it uses.</text>

  <!-- divider -->
  <path class="line dash" d="M380,24 V336" style="stroke: var(--dim)"/>

  <!-- right: personality -->
  <text x="570" y="34" text-anchor="middle" class="head">In a personality server</text>

  <rect x="430" y="52" width="280" height="60" rx="6" class="data"/>
  <text x="570" y="76" text-anchor="middle">Program and C library,</text>
  <text x="570" y="96" text-anchor="middle">unchanged Linux binaries</text>

  <path class="line" d="M570,112 V146" marker-end="url(#arrow)"/>
  <text x="580" y="134" class="small">system calls, trapped</text>

  <rect x="430" y="150" width="280" height="44" rx="6" class="user accent" style="stroke-width: 2.5"/>
  <text x="570" y="177" text-anchor="middle">Personality server: POSIX lives here</text>

  <path class="line" d="M500,194 V226" marker-end="url(#arrow)"/>
  <path class="line" d="M640,194 V226" marker-end="url(#arrow)"/>
  <text x="578" y="216" text-anchor="middle" class="small">messages</text>

  <rect x="430" y="230" width="130" height="50" rx="6" class="user"/>
  <text x="495" y="260" text-anchor="middle" class="small">file system</text>
  <rect x="580" y="230" width="130" height="50" rx="6" class="user"/>
  <text x="645" y="260" text-anchor="middle" class="small">network stack</text>

  <text x="570" y="308" text-anchor="middle" class="small dim">The program can reach only</text>
  <text x="570" y="326" text-anchor="middle" class="small dim">the personality server.</text>

  <rect x="20" y="346" width="720" height="36" rx="6" class="kernel"/>
  <text x="380" y="369" text-anchor="middle" class="head">Microkernel</text>
</svg>
