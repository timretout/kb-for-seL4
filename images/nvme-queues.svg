<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 402" width="760" height="402" role="img">
  <title>One NVMe queue pair and its doorbells</title>
  <desc>The driver copies commands into the submission queue and writes the tail to the SQ tail doorbell; the controller writes completions with a phase tag into the completion queue; the driver reads them and writes its head to the CQ head doorbell.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: #1f2328; }
    .small { font-size: 12px; }
    .head { font-weight: 600; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; }
    .dim { fill: #57606a; }
    .hw { fill: #ddebff; stroke: #3b6bb5; }
    .fw { fill: #eee3fb; stroke: #7a52b3; }
    .kernel { fill: #ffe8cc; stroke: #b86e14; }
    .user { fill: #dcf3e1; stroke: #3d8a50; }
    .data { fill: #f3f4f6; stroke: #6e7781; }
    .hw, .fw, .kernel, .user, .data { stroke-width: 1.5; }
    .line { stroke: #1f2328; stroke-width: 1.5; fill: none; }
    .dash { stroke-dasharray: 5 4; }
    .accent { stroke: #cf222e; }
    .accent-fill { fill: #cf222e; }
    .plain { fill: #ffffff; stroke: #6e7781; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/>
    </marker>
  </defs>
  <rect width="760" height="402" fill="#ffffff"/>
  <rect x="24" y="20" width="140" height="270" rx="6" class="user"/>
  <text x="40" y="44" class="head">Driver</text>
  <rect x="540" y="20" width="196" height="270" rx="6" class="hw"/>
  <text x="556" y="44" class="head">Controller, BAR 0</text>
  <rect x="552" y="56" width="172" height="30" rx="6" class="plain"/>
  <text x="638" y="76" text-anchor="middle">SQ tail doorbell</text>
  <rect x="552" y="240" width="172" height="30" rx="6" class="plain"/>
  <text x="638" y="260" text-anchor="middle">CQ head doorbell</text>
  <rect x="250" y="104" width="220" height="56" rx="6" class="data"/>
  <text x="266" y="127" class="head">Submission queue (SQ)</text>
  <text x="266" y="147" class="small">64-byte commands</text>
  <rect x="250" y="176" width="220" height="56" rx="6" class="data"/>
  <text x="266" y="199" class="head">Completion queue (CQ)</text>
  <text x="266" y="219" class="small">16-byte results, with phase tag</text>
  <text x="360" y="96" class="small dim" text-anchor="middle">rings in host memory</text>
  <path class="line" d="M164,71 H550" marker-end="url(#arrow)"/>
  <text x="180" y="64" class="head">2</text>
  <path class="line" d="M164,132 H248" marker-end="url(#arrow)"/>
  <text x="200" y="125" class="head">1</text>
  <path class="line" d="M470,132 H538" marker-end="url(#arrow)"/>
  <path class="line" d="M540,204 H472" marker-end="url(#arrow)"/>
  <text x="500" y="197" class="head">3</text>
  <path class="line" d="M250,204 H166" marker-end="url(#arrow)"/>
  <path class="line" d="M164,255 H550" marker-end="url(#arrow)"/>
  <text x="180" y="248" class="head">4</text>
  <text x="24" y="318">1  Driver copies a command into the SQ slot at the tail and advances the tail.</text>
  <text x="24" y="340">2  Driver writes the new tail to the SQ tail doorbell.</text>
  <text x="24" y="362">3  Controller writes a completion to the CQ, inverting the phase tag each time it wraps.</text>
  <text x="24" y="384">4  Driver reads entries while the phase matches, then writes its new head to the CQ head doorbell.</text>
</svg>
