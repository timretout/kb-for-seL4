<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img">
  <title>How seL4 starts an x86 application processor</title>
  <desc>The boot processor copies a trampoline to 0x1000, sends INIT and STARTUP IPIs to one application processor and spins; the AP climbs from real mode through the trampoline to boot_node and increments smp_aps_index, which lets the BSP start the next one.</desc>
  <style>
    svg { --bg: #ffffff; --fg: #1f2328; --dim: #57606a; --accent: #cf222e; --hw-fill: #ddebff; --hw-stroke: #3b6bb5; --fw-fill: #eee3fb; --fw-stroke: #7a52b3; --kernel-fill: #ffe8cc; --kernel-stroke: #b86e14; --user-fill: #dcf3e1; --user-stroke: #3d8a50; --data-fill: #f3f4f6; --data-stroke: #6e7781; --data-filled: #c8d1da; }
    @media (prefers-color-scheme: dark) { svg { --bg: #0d1117; --fg: #e6edf3; --dim: #9198a1; --accent: #ff7b72; --hw-fill: #112d52; --hw-stroke: #58a6ff; --fw-fill: #2c1f4a; --fw-stroke: #b48aff; --kernel-fill: #3d2812; --kernel-stroke: #e3a250; --user-fill: #13301c; --user-stroke: #56c26e; --data-fill: #21262d; --data-stroke: #8b949e; --data-filled: #484f58; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: var(--fg); }
    .small { font-size: 12px; }
    .head { font-weight: 600; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; }
    .dim { fill: var(--dim); }
    .hw { fill: var(--hw-fill); stroke: var(--hw-stroke); }
    .fw { fill: var(--fw-fill); stroke: var(--fw-stroke); }
    .kernel { fill: var(--kernel-fill); stroke: var(--kernel-stroke); }
    .user { fill: var(--user-fill); stroke: var(--user-stroke); }
    .data { fill: var(--data-fill); stroke: var(--data-stroke); }
    .hw, .fw, .kernel, .user, .data { stroke-width: 1.5; }
    .line { stroke: var(--fg); stroke-width: 1.5; fill: none; }
    .dash { stroke-dasharray: 5 4; }
    .accent { stroke: var(--accent); }
    .accent-fill { fill: var(--accent); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--fg)"/>
    </marker>
  </defs>
  <rect width="760" height="340" style="fill: var(--bg)"/>
  <rect x="24" y="20" width="306" height="34" rx="6" class="hw"/>
  <text x="177.0" y="42" class="head" text-anchor="middle">BSP (boot processor)</text>
  <rect x="430" y="20" width="306" height="34" rx="6" class="hw"/>
  <text x="583.0" y="42" class="head" text-anchor="middle">AP (application processor)</text>
  <rect x="24" y="74" width="306" height="50" rx="6" class="kernel"/>
  <text x="177.0" y="96" class="mono" text-anchor="middle">copy_boot_code_aps</text>
  <text x="177.0" y="114" class="small" text-anchor="middle">copies the trampoline to <tspan class="mono">0x1000</tspan></text>
  <path class="line" d="M177.0,124 V144" marker-end="url(#arrow)"/>
  <rect x="24" y="144" width="306" height="70" rx="6" class="kernel"/>
  <text x="177.0" y="166" class="mono" text-anchor="middle">start_cpu</text>
  <text x="177.0" y="186" class="small" text-anchor="middle">sends INIT, then STARTUP with</text>
  <text x="177.0" y="204" class="mono" text-anchor="middle">BOOT_NODE_PADDR</text>
  <path class="line" d="M330,165 H430" marker-end="url(#arrow)"/>
  <text x="380" y="158" class="small" text-anchor="middle">INIT</text>
  <path class="line" d="M330,195 H430" marker-end="url(#arrow)"/>
  <text x="380" y="188" class="small" text-anchor="middle">STARTUP</text>
  <rect x="430" y="144" width="306" height="70" rx="6" class="kernel"/>
  <text x="583.0" y="166" text-anchor="middle">trampoline: 16-bit code at <tspan class="mono">0x1000</tspan></text>
  <text x="583.0" y="186" class="small" text-anchor="middle">lgdt, set CR0.PE, ljmpl to 32-bit code,</text>
  <text x="583.0" y="204" class="small" text-anchor="middle">common_init, far jump to _start_ap64</text>
  <path class="line" d="M583.0,214 V234" marker-end="url(#arrow)"/>
  <path class="line" d="M177.0,214 V234" marker-end="url(#arrow)"/>
  <rect x="430" y="234" width="306" height="86" rx="6" class="kernel"/>
  <text x="583.0" y="256" class="mono" text-anchor="middle">boot_node</text>
  <text x="583.0" y="276" class="small" text-anchor="middle">try_boot_node, increments smp_aps_index,</text>
  <text x="583.0" y="292" class="small" text-anchor="middle">takes the big kernel lock, initialises its</text>
  <text x="583.0" y="308" class="small" text-anchor="middle">per-core state, enters the scheduler</text>
  <rect x="24" y="234" width="306" height="86" rx="6" class="kernel"/>
  <text x="177.0" y="258" text-anchor="middle">spins until <tspan class="mono">smp_aps_index</tspan> goes up</text>
  <text x="177.0" y="282" class="small" text-anchor="middle">then starts the next AP: one at a time,</text>
  <text x="177.0" y="298" class="small" text-anchor="middle">because they share the boot stack</text>
  <path class="line dash" d="M430,272 H330" marker-end="url(#arrow)"/>
</svg>
