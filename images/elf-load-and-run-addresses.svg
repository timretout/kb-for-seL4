<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img">
  <title>One PT_LOAD segment in the file, loaded and running</title>
  <desc>A loader copies p_filesz bytes from p_offset in the file to the segment address and zeroes the rest up to p_memsz; a boot loader with no paging places it at p_paddr, and the code runs at p_vaddr, which for the seL4 kernel is KERNEL_OFFSET higher.</desc>
  <style>
    svg { --bg: #ffffff; --fg: #1f2328; --dim: #57606a; --accent: #cf222e; --hw-fill: #ddebff; --hw-stroke: #3b6bb5; --fw-fill: #eee3fb; --fw-stroke: #7a52b3; --kernel-fill: #ffe8cc; --kernel-stroke: #b86e14; --user-fill: #dcf3e1; --user-stroke: #3d8a50; --data-fill: #f3f4f6; --data-stroke: #6e7781; --data-filled: #c8d1da; }
    @media (prefers-color-scheme: dark) { svg { --bg: #0d1117; --fg: #e6edf3; --dim: #9198a1; --accent: #ff7b72; --hw-fill: #112d52; --hw-stroke: #58a6ff; --fw-fill: #2c1f4a; --fw-stroke: #b48aff; --kernel-fill: #3d2812; --kernel-stroke: #e3a250; --user-fill: #13301c; --user-stroke: #56c26e; --data-fill: #21262d; --data-stroke: #8b949e; --data-filled: #484f58; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: var(--fg); }
    .small { font-size: 12px; }
    .head { font-weight: 600; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; }
    .dim { fill: var(--dim); }
    .hw { fill: var(--hw-fill); stroke: var(--hw-stroke); }
    .fw { fill: var(--fw-fill); stroke: var(--fw-stroke); }
    .kernel { fill: var(--kernel-fill); stroke: var(--kernel-stroke); }
    .user { fill: var(--user-fill); stroke: var(--user-stroke); }
    .data { fill: var(--data-fill); stroke: var(--data-stroke); }
    .hw, .fw, .kernel, .user, .data { stroke-width: 1.5; }
    .line { stroke: var(--fg); stroke-width: 1.5; fill: none; }
    .dash { stroke-dasharray: 5 4; }
    .accent { stroke: var(--accent); }
    .accent-fill { fill: var(--accent); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--fg)"/>
    </marker>
  </defs>
  <rect width="760" height="320" style="fill: var(--bg)"/>
  <text x="24" y="36" class="head">In the file</text>
  <text x="264" y="36" class="head">Loaded</text>
  <text x="526" y="36" class="head">Running</text>
  <rect x="24" y="50" width="190" height="30" rx="6" class="data"/>
  <text x="119" y="70" class="small" text-anchor="middle">ELF header</text>
  <rect x="24" y="80" width="190" height="30" rx="6" class="data"/>
  <text x="119" y="100" class="small" text-anchor="middle">program header table</text>
  <rect x="24" y="130" width="190" height="70" rx="6" class="data" style="stroke:var(--accent)"/>
  <text x="119" y="152" class="head" text-anchor="middle">PT_LOAD segment</text>
  <text x="119" y="172" class="mono" text-anchor="middle">p_filesz bytes</text>
  <text x="119" y="190" class="mono" text-anchor="middle">at p_offset</text>
  <text x="119" y="124" class="small dim" text-anchor="middle">...</text>
  <rect x="24" y="210" width="190" height="30" rx="6" class="data"/>
  <text x="119" y="230" class="small" text-anchor="middle">section header table</text>
  <path class="line" d="M214,165 H264" marker-end="url(#arrow)"/>
  <text x="239" y="158" class="small" text-anchor="middle">copy</text>
  <text x="264" y="122" class="small"><tspan class="mono">p_paddr</tspan>: the <tspan class="mono">AT()</tspan> address</text>
  <rect x="264" y="130" width="210" height="70" rx="6" class="data"/>
  <text x="369" y="160" text-anchor="middle">segment bytes</text>
  <text x="369" y="180" class="mono" text-anchor="middle">p_filesz</text>
  <rect x="264" y="200" width="210" height="40" rx="6" class="data" stroke-dasharray="5 4"/>
  <text x="369" y="225" text-anchor="middle">zero fill: <tspan class="mono">.bss</tspan></text>
  <text x="369" y="258" class="small" text-anchor="middle">p_memsz bytes in all</text>
  <text x="526" y="122" class="small"><tspan class="mono">p_vaddr</tspan>: the location counter</text>
  <rect x="526" y="130" width="210" height="70" rx="6" class="data"/>
  <text x="631" y="160" text-anchor="middle">segment bytes</text>
  <rect x="526" y="200" width="210" height="40" rx="6" class="data" stroke-dasharray="5 4"/>
  <text x="631" y="225" text-anchor="middle">zero fill: <tspan class="mono">.bss</tspan></text>
  <path class="line dash" d="M474,185 H526" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="24" y="284" class="small">A boot loader with no paging uses <tspan class="mono">p_paddr</tspan>; an OS loading a process uses <tspan class="mono">p_vaddr</tspan>.</text>
  <text x="24" y="304" class="small">In the seL4 kernel scripts the load address is the virtual address minus <tspan class="mono">KERNEL_OFFSET</tspan>.</text>
</svg>
