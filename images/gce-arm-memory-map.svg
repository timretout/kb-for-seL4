<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 384" width="760" height="384" role="img">
  <title>Physical addresses of a Compute Engine Arm guest</title>
  <desc>The fixed addresses of a Compute Engine Arm guest in rising order: the GICv3 distributor, ITS and redistributors, four PL011 UARTs, the PCI ECAM region and RAM.</desc>
  <style>
    svg { --bg: #ffffff; --fg: #1f2328; --dim: #57606a; --accent: #cf222e; --hw-fill: #ddebff; --hw-stroke: #3b6bb5; --fw-fill: #eee3fb; --fw-stroke: #7a52b3; --kernel-fill: #ffe8cc; --kernel-stroke: #b86e14; --user-fill: #dcf3e1; --user-stroke: #3d8a50; --data-fill: #f3f4f6; --data-stroke: #6e7781; --data-filled: #c8d1da; }
    @media (prefers-color-scheme: dark) { svg { --bg: #0d1117; --fg: #e6edf3; --dim: #9198a1; --accent: #ff7b72; --hw-fill: #112d52; --hw-stroke: #58a6ff; --fw-fill: #2c1f4a; --fw-stroke: #b48aff; --kernel-fill: #3d2812; --kernel-stroke: #e3a250; --user-fill: #13301c; --user-stroke: #56c26e; --data-fill: #21262d; --data-stroke: #8b949e; --data-filled: #484f58; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: var(--fg); }
    .small { font-size: 12px; }
    .head { font-weight: 600; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; }
    .dim { fill: var(--dim); }
    .hw { fill: var(--hw-fill); stroke: var(--hw-stroke); }
    .fw { fill: var(--fw-fill); stroke: var(--fw-stroke); }
    .kernel { fill: var(--kernel-fill); stroke: var(--kernel-stroke); }
    .user { fill: var(--user-fill); stroke: var(--user-stroke); }
    .data { fill: var(--data-fill); stroke: var(--data-stroke); }
    .hw, .fw, .kernel, .user, .data { stroke-width: 1.5; }
    .line { stroke: var(--fg); stroke-width: 1.5; fill: none; }
    .dash { stroke-dasharray: 5 4; }
    .accent { stroke: var(--accent); }
    .accent-fill { fill: var(--accent); }
    .plain { fill: var(--bg); stroke: var(--data-stroke); stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--fg)"/>
    </marker>
  </defs>
  <rect width="760" height="384" style="fill: var(--bg)"/>
  <text x="184" y="30" class="small dim" text-anchor="end">address</text>
  <text x="216" y="30" class="small dim">what is there</text>
  <rect x="200" y="42" width="536" height="46" rx="6" class="hw"/>
  <text x="184" y="70" class="mono" text-anchor="end">0x08000000</text>
  <text x="216" y="62" class="head">GICv3 distributor</text>
  <text x="216" y="80" class="small">96 SPIs</text>
  <rect x="200" y="98" width="536" height="46" rx="6" class="hw"/>
  <text x="184" y="126" class="mono" text-anchor="end">0x08080000</text>
  <text x="216" y="126" class="head">GICv3 ITS</text>
  <rect x="200" y="154" width="536" height="46" rx="6" class="hw"/>
  <text x="184" y="182" class="mono" text-anchor="end">0x080a0000</text>
  <text x="216" y="174" class="head">GICv3 redistributors</text>
  <text x="216" y="192" class="small">from this address</text>
  <rect x="200" y="210" width="536" height="46" rx="6" class="hw"/>
  <text x="184" y="238" class="mono" text-anchor="end">0x09000000</text>
  <text x="216" y="230" class="head">Four PL011 UARTs, 0x1000 apart</text>
  <text x="216" y="248" class="small">the first is the serial console, on SPI 66 (interrupt 98)</text>
  <rect x="200" y="266" width="536" height="46" rx="6" class="hw"/>
  <text x="184" y="294" class="mono" text-anchor="end">0x3f000000</text>
  <text x="216" y="286" class="head">PCI ECAM</text>
  <text x="216" y="304" class="small">gVNIC 1ae0:0042, virtio-rng and an NVMe controller 1ae0:001f</text>
  <rect x="200" y="322" width="536" height="46" rx="6" class="data"/>
  <text x="184" y="350" class="mono" text-anchor="end">0x40000000</text>
  <text x="216" y="342" class="head">RAM</text>
  <text x="216" y="360" class="small">from this address</text>
</svg>
