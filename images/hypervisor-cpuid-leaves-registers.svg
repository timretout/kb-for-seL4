<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" role="img">
  <title>What two hypervisor CPUID leaves return</title>
  <desc>Leaf 0x40000000 returns the highest hypervisor leaf in EAX and a vendor signature in EBX, ECX and EDX. Leaf 0x40000010, read only if that highest leaf is at least 0x40000010, returns the TSC rate in kHz in EAX and the local APIC timer's rate in kHz in EBX.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: #1f2328; }
    .small { font-size: 12px; }
    .head { font-weight: 600; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; }
    .dim { fill: #57606a; }
    .hw { fill: #ddebff; stroke: #3b6bb5; }
    .fw { fill: #eee3fb; stroke: #7a52b3; }
    .kernel { fill: #ffe8cc; stroke: #b86e14; }
    .user { fill: #dcf3e1; stroke: #3d8a50; }
    .data { fill: #f3f4f6; stroke: #6e7781; }
    .hw, .fw, .kernel, .user, .data { stroke-width: 1.5; }
    .line { stroke: #1f2328; stroke-width: 1.5; fill: none; }
    .dash { stroke-dasharray: 5 4; }
    .accent { stroke: #cf222e; }
    .accent-fill { fill: #cf222e; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/>
    </marker>
  </defs>
  <rect width="760" height="250" fill="#ffffff"/>
  <text x="20" y="30" class="head">Leaf</text>
  <text x="225" y="30" text-anchor="middle" class="mono">EAX</text>
  <text x="445" y="30" text-anchor="middle" class="mono">EBX</text>
  <text x="611" y="30" text-anchor="middle" class="mono">ECX</text>
  <text x="703" y="30" text-anchor="middle" class="mono">EDX</text>
  <text x="20" y="70" class="mono">0x40000000</text>
  <rect x="130" y="44" width="190" height="44" rx="6" class="fw" style="stroke:#cf222e"/>
  <text x="225" y="71" text-anchor="middle">highest hypervisor leaf</text>
  <rect x="330" y="44" width="414" height="44" rx="6" class="fw"/>
  <text x="537" y="71" text-anchor="middle">vendor signature, KVMKVMKVM for KVM</text>
  <path class="line accent" d="M225,88 V160" marker-end="url(#arrow)"/>
  <text x="237" y="120" class="small">at least 0x40000010? Then read it; a zero in a register means not offered.</text>
  <text x="20" y="190" class="mono">0x40000010</text>
  <rect x="130" y="164" width="190" height="44" rx="6" class="fw"/>
  <text x="225" y="191" text-anchor="middle">TSC rate in kHz</text>
  <rect x="330" y="164" width="230" height="44" rx="6" class="fw"/>
  <text x="445" y="191" text-anchor="middle">local APIC timer rate in kHz</text>
  <text x="20" y="236" class="small dim">Purple: filled in by the hypervisor.</text>
</svg>
